# Strict local scientific pilot; regular Synapse demo and production profiles
# retain their existing free-form orchestration.
extends: synapse_demo
defaults:
  reasoning: medium
agents:
  HypothesesAgent:
    reasoning: medium
  OrchestratorAgent:
    callbacks:
      before_agent: [before_get_task, inject_graph_root, inject_research_context, user_links]
      before_model: [save_uploaded_artifacts, seed_coder_workspace, redact_link_urls]
      before_tool: [resolve_link_refs]
      after_tool: [register_tool_result_links]
      # ADK returns unknown tool calls as errors so the model can retry with a valid name.
      # guard_unknown_tools would replace that call with a final text response.
      after_model: [require_pilot_delegations, expand_link_refs]
