# Strict local scientific pilot; regular Synapse demo and production profiles
# retain their existing free-form orchestration.
extends: synapse_demo
defaults:
  reasoning: medium
agents:
  HypothesesAgent:
    reasoning: medium
  OrchestratorAgent:
    callbacks:
      before_agent: [before_get_task, inject_graph_root, inject_research_context, user_links]
      before_model: [save_uploaded_artifacts, seed_coder_workspace, redact_link_urls, require_pilot_tool]
      before_tool: [require_pilot_expected_tool, resolve_link_refs]
      after_tool: [register_tool_result_links]
      after_model: [require_pilot_tool_call, expand_link_refs]
