# ─────────────────────────────────────────────────────────────────────────────
# CoScientist — MICROFLUIDICS profile.
#
# A reduced CoScientist deployment for the microfluidics case (ПАВ / target
# molecules synthesised on a flow / microfluidic reactor), covering stages 1–11
# from the ТЗ to the final report.
#
# The graph is MODULAR. RootOrchestrator routes whole modules and never reaches
# inside one: only 3 edges cross a module boundary (2→3, 4→6, 7→11), every other
# edge is the module's own business.
#
#   RootOrchestrator (llm, root)              routes MODULES only
#   ├─ ModuleA_TZLiterature (sequential)      stages 1–2 — ТЗ + literature
#   │    ├─ TZAgent (sequential)              ported from VibePAV
#   │    │    ├─ TZSpecAgent      -> state["structured_tz"]         (ТЗ table)
#   │    │    └─ TZQueryGenAgent  -> state["tz_literature_queries"] (LIT-01…)
#   │    ├─ PlannerAgent          -> create_plan(…), one task per LIT query
#   │    └─ LiteratureOrchestrator-> delegates each LIT task to ResearchAgent
#   ├─ ModuleB_Design (sequential)            stages 3–5
#   │    └─ MolDesignAgent → SynthRouteAgent → EconomicsAgent
#   ├─ ModuleC_Experiment (sequential)        stages 6–10
#   │    ├─ ExpPlannerAgent
#   │    └─ ExperimentLoop (loop, max 3)      the 7⇄8 cycle
#   │         ├─ EquipmentAgent   nodes 9/10 are its TOOLS (CFD, rig)
#   │         └─ OptimizerAgent   finish_optimization ends the loop
#   └─ ReportAgent (llm)                      stage 11
#
# Stages 3–11 run on STUBS (see CoScientist/microfluidics/stubs.py): the
# molecular design, retrosynthesis, economics, CFD and rig services are not
# connected yet. Connecting one replaces a stub BODY — this file does not change.
# Design: docs/superpowers/specs/2026-07-14-microfluidics-graph-modules-design.md
#
# Run a separate CoScientist instance with this profile:
#
#   COSCIENTIST_CONFIG=microfluidics python CoScientist/web/server.py
#   # or: python scripts/run_microfluidics_web.py
#
# Validate with:  COSCIENTIST_CONFIG=microfluidics python -m CoScientist.assembly
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  model: main

agents:
  # ── Root — routes MODULES, never their internals ───────────────────────────
  RootOrchestrator:
    class: llm
    root: true
    description: >-
      CoScientist microfluidics root orchestrator — runs the case module by
      module: ТЗ + literature, design, experiment, report.
    prompt: microfluidics_root_orchestrator
    subordinates:
      - ModuleA_TZLiterature
      - ModuleB_Design
      - ModuleC_Experiment
      - ReportAgent

  # ── Module A — stages 1–2: ТЗ + literature (was the whole profile) ─────────
  ModuleA_TZLiterature:
    class: sequential
    description: >-
      составляет ТЗ из запроса заказчика и выполняет по нему анализ литературы —
      возвращает аналоги и факты. Всегда первый модуль.
    routing: >-
      always run this FIRST — it produces the structured ТЗ every later module
      reads, plus the literature analogues and facts.
    children:
      - TZAgent
      - PlannerAgent
      - LiteratureOrchestrator

  # ── ТЗ stage (ported from VibePAV) ─────────────────────────────────────────
  TZAgent:
    class: sequential
    description: >-
      составляет структурированное техническое задание (ТЗ) из свободного
      запроса заказчика и выводит из него точечные поисковые задачи для
      анализа литературы (кейс микрофлюидики).
    children: [TZSpecAgent, TZQueryGenAgent]

  # Both ТЗ stages are session agents with a human review loop (hitl: true):
  # the agent proposes its artifact (the ТЗ table / the literature queries),
  # the human approves or sends corrections, and the agent rewrites until
  # approved — the CoScientist counterpart of VibePAV's operator questionnaire.
  # For HEADLESS runs (tests, benchmarks) set HITL__ENABLED=false — the review
  # loops (and ResearchAgent approval tools) then pass through automatically.
  TZSpecAgent:
    # tz_session = SessionAgent whose review loop shows the human the RENDERED
    # ТЗ document (reference format of Пример_уточненного_структурированного_ТЗ)
    # instead of the raw JSON the machine pipeline consumes. Once accepted, the
    # agent PUBLISHES the document: tz_documents/TZ_<timestamp>.md on disk,
    # state["structured_tz_document"], and a chat message with the full text
    # (see TZSessionAgent._post_final_events) before planning starts.
    class: custom:tz_session
    description: >-
      агент постановки ТЗ — превращает свободный запрос заказчика в
      структурированный документ ТЗ (16 блоков-таблиц: тип задачи, целевой
      продукт, свойства, критерии качества, ограничения, оборудование,
      приоритеты, форма результата) со статусом каждого поля.
    prompt: microfluidics_tz
    output_key: structured_tz
    output_schema: structured_tz
    hitl: true
    callbacks:
      # Not every provider honours response_format: strip prose/fences around
      # the JSON before ADK's strict output_schema validation.
      after_model: [sanitize_json_output]

  TZQueryGenAgent:
    class: custom:session
    description: >-
      генератор поисковых задач — из структурированного ТЗ формирует 4–6
      конкретных литературных запросов (LIT-01…) с англоязычным поисковым
      запросом и списком данных для извлечения.
    prompt: microfluidics_query_gen
    output_key: tz_literature_queries
    output_schema: tz_literature_queries
    hitl: true
    callbacks:
      after_model: [sanitize_json_output]
      # Save the ТЗ + literature queries as shareable Markdown & HTML files.
      after_agent: [export_tz_and_queries]

  # ── Planning ───────────────────────────────────────────────────────────────
  PlannerAgent:
    class: custom:session
    description: >-
      builds the roadmap FROM the structured ТЗ: one literature task per
      LIT-xx query, registered via create_plan.
    prompt: microfluidics_planner
    tools: [create_plan_tool]
    output_key: planner_roadmap
    hitl: true

  # ── Execution (inside module A) ────────────────────────────────────────────
  # Was the root OrchestratorAgent when the profile stopped at literature.
  # It now lives INSIDE module A: the 1→2 edge is internal to the module, so
  # routing it through RootOrchestrator would break the module boundary.
  LiteratureOrchestrator:
    class: llm
    include_contents: none
    description: >-
      Microfluidics literature orchestrator — executes the roadmap by
      delegating literature tasks to ResearchAgent and sums up the findings
      against the ТЗ.
    prompt: microfluidics_orchestrator
    tools: [task_tracker]
    subordinates:
      - ResearchAgent
    callbacks:
      before_agent: [before_get_task]

  ResearchAgent:
    class: llm
    description: >-
      retrieves scientific knowledge and searches/downloads literature
      (web, RAG, paper search). Open-ended search only.
    routing: >-
      for every literature task (LIT-xx) from the plan and any open-ended
      knowledge question. Pass the task description with the English search
      query (query_en) VERBATIM and the list of data to extract. If it returns
      no/empty/insufficient results, escalate once by reformulating into
      "find and download papers about <expanded topic>".
    planning: |-
      Use this for EVERY literature query derived from the ТЗ (one task per
      LIT-xx query). It searches scientific literature and the web and
      extracts the requested data (classes, IFT/CMC, synthesis routes,
      limitations, analogues).
    prompt: research
    tools: [websearch, paper_analysis, papers_search, task_tracker]
    output_key: search_results
    # What each LIT-xx task actually found is the deliverable — post it to the
    # chat instead of leaving it inside the orchestrator's function_response.
    report_output: true
    callbacks:
      before_agent: [before_get_task]
      before_model: [inject_uploaded_papers]
      before_tool: [WebSearchLimiter]
      after_tool: [log_research_tool_calls]
    hitl: true

  # ── Module B — stages 3–5: design ──────────────────────────────────────────
  # Edge 4→5 stays inside B while 4→6 leaves for C: B runs to completion (the
  # economics are costed) before the orchestrator hands the routes to C.
  ModuleB_Design:
    class: sequential
    description: >-
      проектирует целевые молекулы под ТЗ, выводит маршруты синтеза с условиями
      операций и считает их экономику (стоимость, доступность реагентов в РФ).
    routing: >-
      run after module A, once the ТЗ and the literature findings exist. It
      needs the analogues and facts A produced.
    children:
      - MolDesignAgent
      - SynthRouteAgent
      - EconomicsAgent

  MolDesignAgent:
    class: llm
    description: >-
      молекулярный дизайн — предлагает молекулы-кандидаты (SMILES + свойства)
      под требования ТЗ, опираясь на аналоги из литературы.
    prompt: microfluidics_mol_design
    tools: [molecular_design_stub]
    output_key: design_candidates

  SynthRouteAgent:
    class: llm
    description: >-
      ретросинтез — строит маршруты синтеза кандидатов с условиями каждой
      операции и оценивает их пригодность для проточного реактора.
    prompt: microfluidics_synth_route
    tools: [retrosynthesis_stub]
    output_key: synthesis_routes

  # Node 5 is a LEAF: nothing consumes `economics` until the report (11).
  EconomicsAgent:
    class: llm
    description: >-
      экономика маршрутов — стоимость за кг, доступность реагентов в РФ, риски
      поставок.
    prompt: microfluidics_economics
    tools: [economics_mcp_stub]
    output_key: economics

  # ── Module C — stages 6–10: experiment ─────────────────────────────────────
  ModuleC_Experiment:
    class: sequential
    description: >-
      планирует опыты по маршрутам синтеза и ведёт цикл «установка ⇄
      оптимизация», пока оптимизация не перестанет давать выигрыш.
    routing: >-
      run after module B, passing the synthesis routes and their operating
      conditions. It ends when the optimizer stops the cycle.
    children:
      - ExpPlannerAgent
      - ExperimentLoop

  ExpPlannerAgent:
    class: llm
    description: >-
      планировщик опытов — превращает маршрут синтеза в план экспериментов на
      микрофлюидной установке с числовыми критериями успеха.
    prompt: microfluidics_exp_planner
    output_key: experiment_plan

  # The 7⇄8 cycle. The body repeats until OptimizerAgent calls
  # finish_optimization (which escalates); max_iterations is the backstop —
  # every iteration costs at least two LLM calls.
  ExperimentLoop:
    class: loop
    description: >-
      цикл эксперимента: исполнение плана на установке и оптимизация плана по
      результатам.
    children:
      - EquipmentAgent
      - OptimizerAgent
    options:
      max_iterations: 3

  # Nodes 9 (CFD) and 10 (rig) are this agent's TOOLS, not agents of their own.
  # hitl: it commands real hardware — the approval is wired now, while it is
  # still a stub, so connecting the rig later needs no rework.
  EquipmentAgent:
    class: llm
    description: >-
      установка — исполняет план опытов: считает течение в чипе (CFD) и подаёт
      команды на микрофлюидную установку, снимая телеметрию.
    prompt: microfluidics_equipment
    tools: [cfd_mcp_stub, rig_mcp_stub, microfluidics]
    output_key: experiment_journal
    hitl: true

  # Writes back into `experiment_plan` ON PURPOSE: that shared key IS edge 8→7,
  # so the next iteration of EquipmentAgent runs the refined plan.
  OptimizerAgent:
    class: llm
    description: >-
      оптимизация — по журналу эксперимента уточняет план опытов или завершает
      цикл, когда критерии достигнуты.
    prompt: microfluidics_optimizer
    tools: [finish_optimization]
    output_key: experiment_plan

  # ── Module D — stage 11: report ────────────────────────────────────────────
  ReportAgent:
    class: llm
    description: >-
      финальный отчёт — сводит ТЗ, литературу, кандидатов, маршруты, экономику
      и эксперименты в ответ заказчику.
    routing: >-
      run LAST, once the experiment module is finished or it is clear no
      further optimization is needed (edge 7→11).
    prompt: microfluidics_report
    output_key: final_report
