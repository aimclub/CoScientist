# ─────────────────────────────────────────────────────────────────────────────
# CoScientist — MICROFLUIDICS profile.
#
# A reduced CoScientist deployment for the microfluidics case (ПАВ / target
# molecules synthesised on a flow / microfluidic reactor), covering stages 1–11
# from the ТЗ to the final report.
#
# The graph is MODULAR. RootOrchestrator routes whole modules and never reaches
# inside one. The external experimental subsystem is reached only through A2A.
#
#   RootOrchestrator (llm, root)              routes MODULES only
#   ├─ ModuleA_TZLiterature (sequential)      stages 1–2 — ТЗ + literature
#   │    ├─ TZAgent (sequential)              ported from VibePAV
#   │    │    ├─ TZSpecAgent      -> state["structured_tz"]         (ТЗ, by section)
#   │    │    └─ TZQueryGenAgent  -> state["tz_literature_queries"] (LIT-01…)
#   │    ├─ LiteratureOrchestrator-> delegates each LIT query directly to
#   │    │                           ResearchAgent (no duplicate planning step)
#   │    │                           (every answer -> state["literature_findings"])
#   │    ├─ LiteratureSynthesisAgent -> state["literature_analysis_draft"]
#   │                                   hand-off: target molecule, analogues,
#   │                                   routes + conditions, facts, gaps)
#   │    └─ EvidenceVerifierAgent -> state["literature_analysis"] (authenticated)
#   ├─ ModuleB_Design (sequential)            stages 3–5
#   │    └─ MolDesignAgent → SynthRouteAgent → EconomicsAgent
#   ├─ ModuleC_Experiment (sequential)        external experimental subsystem
#   │    └─ OptimizerAgent                   one A2A task owns planning, CFD,
#   │                                       equipment and the optimization loop
#   └─ ReportAgent (llm)                      stage 11
#
# Optimization, CFD and equipment are owned by the external A2A system.
# CoScientist supplies inputs and consumes its raw results for reporting.
# Design: docs/superpowers/specs/2026-07-14-microfluidics-graph-modules-design.md
#
# Run a separate CoScientist instance with this profile:
#
#   COSCIENTIST_CONFIG=microfluidics python CoScientist/web/server.py
#   # or: python scripts/run_microfluidics_web.py
#
# Validate with:  COSCIENTIST_CONFIG=microfluidics python -m CoScientist.assembly
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  model: main
  reasoning: off

# The root runs the modules in order and each module its steps in order, so
# the web status indicator shows "stage k of N". The stages are the modules'
# steps (SystemConfig.linear_stages: ТЗ, queries, plan, literature, design ×3,
# external experimentation, report); each is labelled by its `title`.
pipeline:
  linear: true

# Tools that serve the system, not the task: a Work Order allows them without
# declaring them and its card does not list them (see system.yaml). This profile
# does not extend system.yaml, so it names its own. get_active_tasks needs no
# entry: it is an orientation read, allowed anyway.
internal_tools:
  - update_task_status
  # waiting between polls of an A2A task is not work the human needs to approve
  - sleep_tool

agents:
  # ── Root — routes MODULES, never their internals ───────────────────────────
  RootOrchestrator:
    class: llm
    root: true
    description: >-
      CoScientist microfluidics root orchestrator — runs the case module by
      module: ТЗ + literature, design, experiment, report.
    prompt: microfluidics_root_orchestrator
    subordinates:
      - ModuleA_TZLiterature
      - ModuleB_Design
      - ModuleC_Experiment
      - ReportAgent

  # ── Module A — stages 1–2: ТЗ + literature (was the whole profile) ─────────
  ModuleA_TZLiterature:
    class: sequential
    description: >-
      составляет ТЗ из запроса заказчика и выполняет по нему анализ литературы —
      возвращает аналоги и факты. Всегда первый модуль.
    routing: >-
      always run this FIRST — it produces the structured ТЗ every later module
      reads, plus the structured literature analysis: the target molecule,
      analogues, synthesis routes with conditions, and facts.
    children:
      - TZAgent
      - LiteratureOrchestrator
      - LiteratureSynthesisAgent
      - EvidenceVerifierAgent

  # ── ТЗ stage (ported from VibePAV) ─────────────────────────────────────────
  TZAgent:
    internal: true
    class: sequential
    description: >-
      составляет структурированное техническое задание (ТЗ) из свободного
      запроса заказчика и выводит из него точечные поисковые задачи для
      анализа литературы (кейс микрофлюидики).
    children: [TZSpecAgent, TZQueryGenAgent]

  # Both ТЗ stages are session agents with a human review loop (hitl: true):
  # the agent proposes its artifact (the ТЗ table / the literature queries),
  # the human approves or sends corrections, and the agent rewrites until
  # approved — the CoScientist counterpart of VibePAV's operator questionnaire.
  # For HEADLESS runs (tests, benchmarks) set HITL__ENABLED=false — the review
  # loops (and ResearchAgent approval tools) then pass through automatically.
  TZSpecAgent:
    # tz_session = SessionAgent whose review loop shows the human the RENDERED
    # ТЗ document (reference format of Пример_уточненного_структурированного_ТЗ)
    # instead of the raw JSON the machine pipeline consumes. Once accepted, the
    # agent PUBLISHES the document: tz_documents/TZ_<timestamp>.md on disk,
    # state["structured_tz_document"], and a chat message with the full text
    # (see TZSessionAgent._post_final_events) before planning starts.
    #
    # The ТЗ is filled SECTION BY SECTION: one fill_tz_section call per
    # canonical block, strictly in order; each answer reports the progress
    # (k/16) and names the next section, a rejected call names the step and
    # the field at fault. The tool itself writes state["structured_tz"], so
    # there is no output_key/output_schema — the final answer is a short
    # "done" line. edit_tz_section (per-section edits of an assembled ТЗ) is
    # registered but deliberately NOT attached yet.
    #
    # parallel_build: the 16 sections are split into 3 independent parts
    # (SECTION_GROUPS in tz_builder.py: «Задача и продукт», «Свойства и
    # качество», «Ограничения и ресурсы») and one worker per part — same
    # model, its own prompt and scoped fill_tz_section — fills its part AT
    # THE SAME TIME, instead of this agent's LLM walking all 16 in a row.
    # The fields the operator leaves empty are filled the same way: each
    # part's fill worker (its prompt shows the whole current ТЗ) fills the
    # ones in its sections, all at once. Workers appear in the metrics as
    # TZSpecAgent_<part> and TZSpecAgent_<part>_fill. Set it to false to go
    # back to this agent's own sequential build and fill.
    #
    # Review: the operator fills the ТЗ as a form in the web ТЗ panel; fields
    # left empty are filled by the agent through fill_agent_fields (one
    # section per call, highlighted as «заполнено агентом») and the ТЗ goes
    # back to the operator — round after round (see tz_review.py).
    class: custom:tz_session
    title: Техническое задание
    description: >-
      агент постановки ТЗ — превращает свободный запрос заказчика в
      структурированный документ ТЗ (16 блоков-таблиц: тип задачи, целевой
      продукт, свойства, критерии качества, ограничения, оборудование,
      приоритеты, форма результата) со статусом каждого поля.
    prompt: microfluidics_tz
    tools: [fill_tz_section, fill_agent_fields]
    hitl: true
    options:
      parallel_build: true

  TZQueryGenAgent:
    class: custom:session
    title: Поисковые запросы
    description: >-
      генератор поисковых задач — из структурированного ТЗ формирует 4–6
      конкретных литературных задач (LIT-01…) со списком данных для
      извлечения.
    prompt: microfluidics_query_gen
    output_key: tz_literature_queries
    output_schema: tz_literature_queries
    hitl: true
    callbacks:
      # The queries must target the customer's molecule when the ТЗ fixes one.
      before_agent: [inject_target_molecule]
      after_model: [sanitize_json_output]
      # Save the ТЗ + literature queries as shareable Markdown & HTML files.
      after_agent: [export_tz_and_queries]

  # The query generator already produces executable LIT-* requests. A separate
  # planner only copied those requests into create_plan tasks, so it is kept
  # available for shared/default profiles but disabled here.
  PlannerAgent:
    enabled: false
    class: custom:session
    title: План исследования
    description: >-
      builds the roadmap FROM the structured ТЗ: one literature task per
      LIT-xx query, registered via create_plan.
    prompt: microfluidics_planner
    tools: [create_plan_tool]
    output_key: planner_roadmap
    hitl: true

  # ── Execution (inside module A) ────────────────────────────────────────────
  # The 1→2 edge is direct: TZQueryGenAgent writes tz_literature_queries and
  # this agent delegates those exact requests to ResearchAgent. There is no
  # intermediate roadmap/planner stage.
  LiteratureOrchestrator:
    class: llm
    title: Анализ литературы
    include_contents: none
    description: >-
      Microfluidics literature orchestrator — executes the roadmap by
      delegating independent literature tasks to ResearchAgent in parallel and
      sums up the findings against the ТЗ.
    prompt: microfluidics_orchestrator
    # Its closing summary across all LIT tasks — kept, not just posted.
    output_key: literature_report
    subordinates:
      - ResearchAgent
    callbacks:
      before_agent: [before_get_task, inject_target_molecule]
    # Unified HITL / Work Order for the literature stage: one check at the start
    # (search plan approval) and one at the end (literature findings review),
    # without interrupting individual ResearchAgent runs. Needs HITL__ENABLED=true.
    hitl: true
    work_order: true

  ResearchAgent:
    class: llm
    description: >-
      retrieves scientific knowledge and searches/downloads literature
      (web, RAG, paper search). Open-ended search only.
    routing: >-
      for every literature task (LIT-xx) from the plan and any open-ended
      knowledge question. Pass the task description VERBATIM with the list of
      data to extract — it composes the search queries itself. If it returns
      no/empty/insufficient results, escalate once by reformulating into
      "find and download papers about <expanded topic>".
    planning: |-
      Use this for EVERY literature query derived from the ТЗ (one task per
      LIT-xx query). It searches scientific literature and the web and
      extracts the requested data (classes, IFT/CMC, synthesis routes,
      limitations, analogues).
    prompt: research
    tools: [websearch, paper_analysis, papers_search, task_tracker]
    output_key: search_results
    # Runs concurrently for all LIT-xx tasks under LiteratureOrchestrator. HITL review is done
    # at the orchestrator level (common start and end checks), so research queries
    # run through autonomously.
    # What each LIT-xx task actually found is the deliverable — post it to the
    # chat instead of leaving it inside the orchestrator's function_response.
    report_output: true
    callbacks:
      before_agent: [before_get_task]
      before_model: [inject_uploaded_papers]
      before_tool: [WebSearchLimiter]
      after_tool: [log_research_tool_calls]
      # Keep every LIT-xx answer under a collision-free per-query state key.
      after_agent: [collect_literature_finding]

  # ── Hand-off of module A ───────────────────────────────────────────────────
  # Turns the per-task answers into ONE structured result the design module
  # and the report read. No tools: output_schema only. When the ТЗ fixes the
  # target molecule, pin_target_molecule makes the ТЗ's values win.
  LiteratureSynthesisAgent:
    class: llm
    title: Итоги литературного анализа
    include_contents: none
    description: >-
      сводит результаты всех литературных задач в структурированный итог:
      целевая молекула, аналоги (SMILES + свойства), маршруты синтеза с
      условиями, факты с источниками и пробелы.
    prompt: microfluidics_literature_synthesis
    output_key: literature_analysis_draft
    output_schema: literature_analysis
    callbacks:
      before_agent: [inject_target_molecule]
      after_model: [sanitize_json_output]

  EvidenceVerifierAgent:
    class: llm
    title: Проверка источников
    include_contents: none
    description: >-
      независимо сверяет числовые условия и выходы с полными
      текстами источников; неподтверждённые claims оставляет unverified.
    prompt: microfluidics_evidence_verifier
    tools: [websearch, paper_analysis, papers_search]
    output_key: literature_analysis
    output_schema: literature_analysis
    callbacks:
      before_agent: [begin_evidence_verification]
      before_tool: [WebSearchLimiter]
      after_tool: [capture_evidence_verification]
      after_model: [sanitize_json_output]
      after_agent: [authenticate_evidence_verification, pin_target_molecule]

  # ── Module B — stages 3–5: design ──────────────────────────────────────────
  # Edge 4→5 stays inside B while 4→6 leaves for C: B runs to completion (the
  # economics are costed) before the orchestrator hands the routes to C.
  ModuleB_Design:
    class: sequential
    description: >-
      проектирует целевые молекулы под ТЗ, выводит маршруты синтеза с условиями
      операций и считает их экономику (стоимость, доступность реагентов в РФ).
    routing: >-
      run after module A, once the ТЗ and the literature findings exist. It
      needs the analogues and facts A produced.
    children:
      - MolDesignAgent
      - SynthRouteAgent
      - EconomicsAgent

  MolDesignAgent:
    class: llm
    title: Молекулярный дизайн
    description: >-
      молекулярный дизайн — предлагает молекулы-кандидаты (SMILES + свойства)
      под требования ТЗ, опираясь на аналоги из литературы.
    reasoning: medium
    prompt: microfluidics_mol_design
    tools: [molecular_design]
    output_key: design_candidates
    # Structured hand-off (DesignCandidates): who to synthesise, with SMILES.
    output_schema: design_candidates
    callbacks:
      # A molecule the customer fixed in the ТЗ is handed on as the only
      # candidate — no LLM call, no design.
      before_agent: [compile_requirements, use_fixed_target_molecule]

  SynthRouteAgent:
    class: llm
    title: Маршруты синтеза
    description: >-
      отбирает подтверждённые литературные маршруты кандидатов с условиями
      каждой операции и оценивает их пригодность для проточного реактора.
    reasoning: medium
    prompt: microfluidics_synth_route
    # The external retrosynthesis proposals are intentionally disabled here:
    # this stage only transfers route-backed literature evidence.  The template
    # switches to its literature-only branch when this list is empty.
    tools: []
    output_key: synthesis_routes
    # It sends target structures to an external service: the human sees the
    # plan (what goes out), every step and the report. Needs HITL__ENABLED=true.
    hitl: true
    work_order: true
    work_order_step_review: true
    # Structured hand-off (SynthesisRoutes): steps with reactants / agents /
    # products / conditions / yield — the shape the economics server costs.
    output_schema: synthesis_routes
    callbacks:
      before_agent: [compile_requirements]
      after_agent: [qualify_synthesis_routes]

  # Economics feeds the optimization module and the final report.
  EconomicsAgent:
    class: llm
    title: Экономика маршрутов
    description: >-
      экономика маршрутов — стоимость за кг, доступность реагентов в РФ, риски
      поставок.
    reasoning: low
    prompt: microfluidics_economics
    # economics_mcp once MCP_MICROFLUIDIC_ECONOMIC is set, otherwise the stub.
    tools: [economics_mcp, economics_mcp_stub]
    output_key: economics
    # The agent sends routes and substances to an external service: the human
    # approves the plan (what goes out, what is expected), checks every step
    # (sent / expected / found) and the final report. Needs HITL__ENABLED=true —
    # without it none of this is attached and the agent runs straight through.
    hitl: true
    work_order: true
    work_order_step_review: true
    callbacks:
      before_agent: [compile_requirements, gate_economics, inject_target_molecule]
      before_tool: [guard_economics_routes]
      # The server's numbers, as given, for the report: economics_ranking.
      after_tool: [collect_economics_result]

  # ── Module C — external experimental subsystem through A2A ────────────────
  ModuleC_Experiment:
    class: sequential
    description: >-
      передаёт ТЗ, литературу, маршруты и экономический рейтинг во внешнюю
      A2A-систему, которая сама выполняет CFD, опыты и оптимизацию.
    routing: >-
      run after module B with a valid economic ranking. The external system
      owns the entire experiment loop; pass its original results to the report.
    children:
      - OptimizerAgent

  OptimizerAgent:
    class: llm
    title: Внешняя оптимизация и эксперименты
    description: >-
      сопровождает одну задачу внешней A2A-системы: передаёт входные данные,
      уточнения и подтверждения, получает статусы и результаты экспериментов.
    reasoning: medium
    prompt: microfluidics_optimizer
    tools: [optimization_a2a, sleep]
    # Narrative is separate from raw service results written by the tools.
    output_key: optimization_summary
    hitl: true
    work_order: true
    work_order_step_review: true

  # ── Module D — stage 11: report ────────────────────────────────────────────
  ReportAgent:
    class: llm
    title: Итоговый отчёт
    description: >-
      финальный отчёт — сводит ТЗ, литературу, кандидатов, маршруты, экономику
      и эксперименты в ответ заказчику.
    routing: >-
      run LAST, once the experiment module is finished or it is clear no
      further optimization is possible; report pending/failed tasks honestly.
    reasoning: low
    prompt: microfluidics_report
    output_key: final_report
