                .replace(/<a /g, '<a target="_blank" rel="noopener noreferrer" '); }
        catch (e) { html = null; }
      }
      const size = raw.length > 900 ? ` <span class="chars">${esc(t('graph.chars', { count: raw.length.toLocaleString() }))}</span>` : "";
      return `<div class="k">${title}${size}</div>`
        + (html ? `<div class="report">${html}</div>` : `<pre>${esc(raw)}</pre>`)
        + truncationNote(raw, false);
    }
    // What the agent left behind: files its tools wrote and links its report names.
    function artifactsBlock(list){
      if (!Array.isArray(list) || !list.length) return "";
      return `<div class="k">${t('graph.detail.artifacts')} <span class="chars">${list.length}</span></div>` + list.map(a => {
        const file = a.kind === "file";
        const name = file ? `<span class="uri">${esc(a.uri)}</span>`
          : `<a class="uri" href="${esc(a.uri)}" target="_blank" rel="noopener noreferrer">${esc(a.uri)}</a>`;
        return `<div class="art"><span class="ic">${file ? "📦" : "🔗"}</span>${name}`
          + (a.tool ? `<span class="by">${esc(a.tool)}</span>` : "") + `</div>`;
      }).join("");
    }
    // An agent opens on its task and its report, then what it produced, then
    // the tool calls it made, folded, in the order they ran. A request opens
    // on the prompt, an answer on the answer, and a call nobody owns on itself.
    function showDetailClassic(n){
      const isAgent = n.kind === "agent" || n.kind === "agent_call";
      const name = String(n.executor_agent || n.label || t('graph.detail.agent'));
      const title = isAgent ? (n.stage ? n.stage + ". " : "") + name
        : n.kind === "goal" ? "❯ " + t('graph.detail.request') : n.kind === "result" ? "✔ " + t('graph.detail.answer')
        : String(n.label || n.kind || "");
      let body;
      if (n.kind === "goal") body = readable(t('graph.detail.whatAsked'), n.label);
      else if (n.kind === "result") body = reportBlock(t('graph.detail.answer'), n.output || n.label);
      else if (isAgent) {
        const where = n.io_source === "delegation" ? t('graph.detail.ioDelegation')
          : n.io_source === "request" ? t('graph.detail.ioRequest') : "";
        body = reportBlock(t('graph.detail.report'), n.output)
          + artifactsBlock(n.artifacts)
          + readable(t('graph.detail.task'), n.input, { agent: n.executor_agent })
          + (where ? `<div class="note">${esc(where)}</div>` : "");
      } else body = readable(t('graph.detail.arguments'), n.input) + readable(t('graph.detail.result'), n.output);
      if (isAgent) {
        // Older snapshots recorded nothing on the agent itself; say so, or
        // the panel opening on the call list reads as a missing section.
        if (!body) body = `<div class="k">${t('graph.detail.taskReport')}</div><div class="empty">${t('graph.detail.notRecorded')}</div>`;
        const calls = Array.isArray(n.calls) ? n.calls : [];
        const failed = calls.filter(c => c.status === "failed").length;
        body += calls.length
          ? `<div class="k">${t('graph.detail.toolCalls')} <span class="chars">${calls.length}${failed ? t('graph.detail.failedCount', { count: failed }) : ""}</span></div>`
            + calls.map(callRow).join("")
          : `<div class="k">${t('graph.detail.toolCalls')}</div><div class="empty">${t('graph.detail.noneRecorded')}</div>`;
      }
      if (!body) body = `<div class="empty">${t('graph.detail.empty')}</div>`;
      paint(n, headOf(n, title) + `<div class="dbody">${body}</div>`);
    }
    function closeDetail(){ selectedId=null; lastDetailStamp=null; paintedId=null;
      focusCallId=null; focusPending=false;
      document.getElementById("detail").style.display="none"; }

    // Jump from an Evidence's provenance to the exact tool call in the
    // execution log. The call is folded into its agent's card, so the agent is
    // what gets selected and the call is unfolded and lit inside it.
    // Recorders have spelled a call's node id two ways — `tool:call_x` now,
    // `goal:{invocation}::tool:call_x` before — and evidence recorded under
    // one spelling is read against the other. The call id is the tail either
    // way, so that is what is compared; an exact match still wins first.
    const callKey = id => String(id == null ? "" : id).split("::").pop();
    const sameCall = (a, b) => a === b || callKey(a) === callKey(b);

    function ownerOfCall(execId){
      for (const id in nodeData)
        if ((nodeData[id].calls || []).some(c => sameCall(c.id, execId))) return id;
      return null;
    }

    // Opened in its own tab, so following a result back to the call that
    // produced it does not cost you the graph you were reading.
    function jumpToExecution(execId){
      const q = new URLSearchParams(location.search);
      window.open("/graph?" + new URLSearchParams({
        user_id: q.get("user_id") || "", session_id: q.get("session_id") || "",
        view: "execution", call: execId,
      }), "_blank", "noopener");
    }

    // The link names a call, not a node, and not the request it belongs to —
    // calls are folded into the agent that made them. So the requests are
    // searched for the one holding it, and that is the one the page opens on.
    let wantedCall = null, revealTries = 0;
    async function openTurnHolding(execId){
      const q = new URLSearchParams(location.search);
      const base = `/api/users/${encodeURIComponent(q.get("user_id") || "")}`
                 + `/sessions/${encodeURIComponent(q.get("session_id") || "")}/graph?view=execution`;
      const holds = g => (g.nodes || []).some(
        n => (n.calls || []).some(c => sameCall(c.id, execId)));
      try {
        const first = await (await fetch(base, { cache: "no-store" })).json();
        if (holds(first)) return first.turn_id;
        for (const t of (first.turns || []).slice().reverse()) {
          if (t.turn_id === first.turn_id) continue;
          const g = await (await fetch(
            base + "&turn=" + encodeURIComponent(t.turn_id), { cache: "no-store" })).json();
          if (holds(g)) return t.turn_id;
        }
      } catch (e) { /* fall through: the newest request is still a sane landing */ }
      return null;
    }

    // Once the request is drawn, open the agent holding the call and unfold it
    // — the same highlight a jump inside one tab would have given.
    function revealWantedCall(){
      if (!wantedCall) return;
      const host = ownerOfCall(wantedCall);
      if (!host) {
        // Landing on the log with nothing selected looks like the link did
        // nothing. Say which call could not be placed and stop trying.
        if (++revealTries > 3) {
          document.getElementById("status").textContent =
            t('graph.callNotFound', { call: wantedCall });
          wantedCall = null;
        }
        return;
      }
      // The agent's own id, then the call as THIS graph spells it.
      const call = (nodeData[host].calls || [])
        .map(c => c.id).find(id => sameCall(id, wantedCall)) || wantedCall;
      wantedCall = null;
      try { network.selectNodes([host]); network.focus(host, { scale: 1.0, animation: true }); } catch(e){}
      selectedId = host;
      focusCallId = call; focusPending = true; openCalls.add(call);
      lastDetailStamp = JSON.stringify(nodeData[host]);
      showDetail(nodeData[host]);
    }
    // ── wiring ────────────────────────────────────────────────────────────────
    let lastDetailStamp = null;
    function hardReset(){ nodes.clear(); edges.clear(); lastDetailStamp = null;
      fitted = false; lastPhases = []; lastGraph = { nodes: [], edges: [] };
      pinned = {}; pinnedFor = ""; stageBands = [];
      for (const k in nodeData) delete nodeData[k]; closeDetail(); }
    document.getElementById("refresh").onclick = poll;
    document.getElementById("view").onchange = () => {
      const sel = document.getElementById("turn");
      sel.innerHTML = ""; sel.dataset.keys = "";   // a request id is not a study id
      hardReset(); makeNetwork(); updateChrome(); poll();
    };
    document.getElementById("turn").onchange = () => { hardReset(); poll(); };
    let timer=null;
    function loop(){ if (document.getElementById("auto").checked) poll(); timer=setTimeout(loop,1500); }
    // Honour ?view= so a link can open the view it means. Without this the page
    // always opened on research, and the trace page's "graph view" link landed
    // on a different graph than the one it offered.
    (() => {
      const q = new URLSearchParams(location.search);
      const wanted = q.get("view");
      // A link may name the request to open; the picker is filled on first poll.
      const wantedTurn = q.get("turn");
      if (wantedTurn) {
        const sel = document.getElementById("turn");
        sel.innerHTML = `<option value="${wantedTurn}">…</option>`;
        sel.value = wantedTurn;
        document.getElementById("turnWrap").style.display = "";
      }
      const sel = document.getElementById("view");
      if (wanted && [...sel.options].some(o => o.value === wanted)) sel.value = wanted;
      const back = document.getElementById("totrace");
      if (back && q.get("user_id")) back.href = "/trace?" + new URLSearchParams({
        user_id: q.get("user_id"), session_id: q.get("session_id") || "" });
    })();
    makeNetwork(); updateChrome();
    (async () => {
      const wanted = new URLSearchParams(location.search).get("call");
      if (wanted) {
        wantedCall = wanted;
        const turnId = await openTurnHolding(wanted);
        if (turnId) {
          const sel = document.getElementById("turn");
          sel.innerHTML = `<option value="${turnId}">…</option>`;
          sel.value = turnId;
          document.getElementById("turnWrap").style.display = "";
        }
      }
      poll(); loop();
    })();
  </script>
</body>
</html>
