<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title data-i18n="graph.title">CoScientist — Research Graph</title>
  <script src="/static/vis-network.min.js"></script>
  <script src="/static/js/i18n.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <style>
    :root {
      --bg: #14161a; --surface: #1c1f26; --surface2: #23272f; --line: #2c313a;
      --ink: #e8eaed; --ink2: #9aa3af; --ink3: #6b7280;
      --good: #22c55e; --warn: #f59e0b; --crit: #ef4444; --info: #3b82f6;
      --accent: #38bdf8; --orange: #f97316; --slate: #64748b; --violet: #8b5cf6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: -apple-system, "Segoe UI", Roboto, Inter, sans-serif; font-size: 13px; }

    /* top bar */
    #bar { position: fixed; top: 0; left: 0; right: 0; height: 46px; display: flex;
      align-items: center; gap: 16px; padding: 0 16px; background: var(--surface);
      border-bottom: 1px solid var(--line); z-index: 20; }
    #bar .brand { font-weight: 700; letter-spacing: .2px; }
    #bar .brand .dot { color: var(--accent); }
    #bar label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      color: var(--ink2); user-select: none; }
    #bar select, #bar button { background: var(--surface2); color: var(--ink);
      border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; font-size: 12px; cursor: pointer; }
    #bar button:hover { border-color: var(--accent); }
    #status { color: var(--ink3); font-variant-numeric: tabular-nums; }
    .spacer { margin-left: auto; }

    /* research header (question + progress) */
    #head { position: fixed; top: 46px; left: 0; right: 0; z-index: 15; padding: 12px 16px;
      background: linear-gradient(180deg, var(--surface) 0%, rgba(28,31,38,.0) 100%);
      pointer-events: none; }
    #head.hidden { display: none; }
    #question { font-size: 15px; font-weight: 650; color: var(--ink); max-width: 62%;
      line-height: 1.35; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,.5);
      /* A question written as a whole brief ran to eight lines and pushed the
         first band off the screen. Three lines here, the rest on hover and in
         the card the question has of its own. */
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden; pointer-events: auto; cursor: default; }
    #question .q { color: var(--accent); font-weight: 700; }
    #counters, #meta, #gaps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    #counters { margin-bottom: 6px; }
    #counters .tile { font-size: 11px; font-weight: 600; padding: 2px 8px;
      border: 1px solid; border-radius: 999px; background: rgba(20,22,26,.72);
      font-variant-numeric: tabular-nums; }
    #meta { font-size: 11px; color: var(--ink3); margin-bottom: 6px; }
    /* #head ignores the mouse so the canvas stays draggable under it; the
       gaps banner is the one part meant to be read closely, so it takes
       pointer events back for its own tooltips. */
    #gaps { pointer-events: auto; }
    #gaps .gap { font-size: 11px; color: var(--warn); padding: 2px 8px;
      border: 1px dashed rgba(245,158,11,.45); border-radius: 7px;
      background: rgba(20,22,26,.72); }

    /* canvas + panels */
    #net { position: absolute; top: 46px; bottom: 0; left: 0; right: 0; }
    #detail { position: fixed; top: 46px; right: 0; width: 400px; bottom: 0; background: var(--surface);
      border-left: 1px solid var(--line); padding: 0; overflow-y: auto; z-index: 18; display: none;
      box-shadow: -12px 0 32px rgba(0,0,0,.4); }
    #detail .dhead { padding: 16px 18px 12px; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: var(--surface); }
    #detail .dbody { padding: 14px 18px 24px; }
    #detail h3 { margin: 0 0 4px; font-size: 16px; word-break: break-word; }
    #detail .sub { color: var(--ink3); font-size: 12px; }
    #detail .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-weight: 700;
      font-size: 11px; margin-top: 8px; }
    #detail .close { float: right; cursor: pointer; color: var(--ink3); font-size: 20px; line-height: 1; }
    #detail .close:hover { color: var(--ink); }
    #detail .k { color: var(--accent); font-weight: 600; font-size: 11px; text-transform: uppercase;
      letter-spacing: .4px; margin: 14px 0 4px; }
    #detail .attr { margin: 3px 0; color: var(--ink); word-break: break-word; }
    #detail .attr .ak { color: var(--ink2); }
    .chars { color: var(--ink3); font-size: 10px; letter-spacing: 0;
      text-transform: none; margin-left: 6px; }
    #detail pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 10px;
      border-radius: 8px; color: var(--ink); font-size: 12px; line-height: 1.5; margin: 4px 0 0;
      border: 1px solid var(--line);
      /* The whole value is here; long ones scroll rather than being cut. */
      max-height: 46vh; overflow-y: auto; }
    #detail .prov { background: var(--bg); border: 1px solid var(--line); border-left: 3px solid var(--accent);
      border-radius: 8px; padding: 9px 11px; margin: 6px 0; cursor: pointer; transition: border-color .12s, background .12s; }
    #detail .prov:hover { border-color: var(--accent); background: #1a1f28; }
    #detail .prov .tool { font-weight: 700; color: var(--accent); font-family: ui-monospace, monospace; font-size: 12px; }
    #detail .prov .jump { float: right; color: var(--accent); font-size: 10px; opacity: .65; }
    #detail .prov .res { color: var(--ink2); font-size: 11.5px; margin-top: 5px; line-height: 1.5;
      white-space: pre-wrap; overflow-wrap: anywhere; max-height: 160px; overflow-y: auto; }
    #detail .empty { color: var(--ink3); font-style: italic; }

    /* readable values: a mapping is labelled rows, not a wall of braces */
    .kv { margin-top: 2px; }
    .kv .row { display: grid; grid-template-columns: minmax(64px, max-content) 1fr; gap: 2px 12px;
      padding: 5px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
    .kv .row:last-child { border-bottom: 0; }
    .kv .key { color: var(--ink2); font-size: 11.5px; font-family: ui-monospace, monospace;
      word-break: break-word; }
    .kv .val { color: var(--ink); font-size: 12.5px; line-height: 1.45; white-space: pre-wrap;
      overflow-wrap: anywhere; min-width: 0; }
    .kv .val.block { grid-column: 1 / -1; background: var(--bg); border: 1px solid var(--line);
      border-radius: 6px; padding: 7px 9px; max-height: 40vh; overflow-y: auto; }
    .kv .val.dim { color: var(--ink3); font-size: 11px; }
    .kv .mono { font-family: ui-monospace, monospace; font-size: 11.5px; }
    .kv .nested { grid-column: 1 / -1; margin-left: 10px; padding-left: 10px;
      border-left: 2px solid var(--line); }
    .kv ol.items { margin: 0; padding-left: 18px; color: var(--ink); font-size: 12.5px; }
    .kv ol.items li { margin: 3px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
    .kv ol.items li + li { border-top: 1px dashed var(--line); padding-top: 3px; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
      background: var(--surface2); border: 1px solid var(--line); color: var(--ink);
      margin: 0 4px 4px 0; white-space: nowrap; }

    /* tool-call history under an agent: a folded row each, opened on click */
    .call { border: 1px solid var(--line); border-radius: 8px; margin: 6px 0; background: var(--bg); }
    .call .hd { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
      user-select: none; }
    .call .hd:hover { background: #1a1f28; }
    .call .st { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .call .tool { font-family: ui-monospace, monospace; font-weight: 700; font-size: 12px;
      color: var(--accent); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    .call .when { color: var(--ink3); font-size: 11px; font-variant-numeric: tabular-nums;
      white-space: nowrap; }
    .call .caret { color: var(--ink3); font-size: 9px; transition: transform .12s; }
    .call.open .caret { transform: rotate(90deg); }
    .call .gist { color: var(--ink2); font-size: 11.5px; padding: 0 10px 8px 26px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .call .bd { display: none; padding: 0 10px 10px; border-top: 1px solid var(--line); }
    .call.open .bd { display: block; }
    .call .bd .k { margin-top: 10px; }
    .call.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

    /* an agent's report, rendered from its markdown */
    .report { background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; font-size: 12.5px; line-height: 1.55; max-height: 52vh; overflow-y: auto;
      overflow-wrap: anywhere; }
    .report > :first-child { margin-top: 0; } .report > :last-child { margin-bottom: 0; }
    .report h1, .report h2, .report h3, .report h4 { font-size: 13px; margin: 12px 0 4px; color: var(--ink); }
    .report h1 { font-size: 14px; }
    .report p, .report ul, .report ol { margin: 6px 0; } .report li { margin: 2px 0; }
    .report code { font-family: ui-monospace, monospace; font-size: 11.5px; background: var(--surface2);
      padding: 1px 4px; border-radius: 4px; }
    .report pre { max-height: none; margin: 6px 0; } .report pre code { background: none; padding: 0; }
    .report a { color: var(--accent); } .report img { max-width: 100%; border-radius: 6px; }
    .report table { border-collapse: collapse; font-size: 11.5px; }
    .report th, .report td { border: 1px solid var(--line); padding: 3px 6px; }
    .report blockquote { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--line); color: var(--ink2); }
    /* artifacts: what the agent left behind */
    .art { display: flex; align-items: baseline; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .art:last-child { border-bottom: 0; }
    .art .ic { flex: none; }
    .art .uri { font-family: ui-monospace, monospace; font-size: 11.5px; overflow-wrap: anywhere; color: var(--ink); }
    .art a.uri { color: var(--accent); text-decoration: none; } .art a.uri:hover { text-decoration: underline; }
    .art .by { color: var(--ink3); font-size: 11px; white-space: nowrap; margin-left: auto; }
    #detail .note { color: var(--ink3); font-size: 11.5px; font-style: italic; margin: 2px 0 0; }
  </style>
</head>
<body>
  <div id="bar">
    <span class="brand">CoScientist <span class="dot">◆</span> <span data-i18n="graph.brand">Graph</span></span>
    <label><span data-i18n="graph.view.label">view</span>
      <select id="view">
        <option value="research" data-i18n="graph.view.research">research</option>
        <option value="execution" data-i18n="graph.view.execution">execution log</option>
      </select>
    </label>
    <label id="turnWrap" style="display:none"><span id="turnLabel">request</span>
      <select id="turn" style="max-width:340px"></select>
    </label>
    <label><input type="checkbox" id="auto" checked /> <span data-i18n="graph.live">live</span></label>
    <button id="refresh" data-i18n-title="graph.refresh">↻</button>
    <span class="spacer"></span>
    <span id="status" data-i18n="graph.connecting">connecting…</span>
      <a id="totrace" href="/trace" style="margin-left:auto;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12px;text-decoration:none" data-i18n="graph.backTrace">← session trace</a>
  </div>

  <div id="head">
    <div id="question"></div>
    <div id="counters"></div>
    <div id="meta"></div>
    <div id="gaps"></div>
  </div>

  <div id="net"></div>
  <div id="detail"></div>

  <script>
    // ══════════════════════════════════════════════════════════════════════════
    //  Encoding — COLOR = status (reserved status palette), ICON = type,
    //  GLYPH = status (so identity is never colour-alone; CVD-safe).
    // ══════════════════════════════════════════════════════════════════════════
    const C = getComputedStyle(document.documentElement);
    const col = n => C.getPropertyValue(n).trim();
    const GOOD=col('--good'), WARN=col('--warn'), CRIT=col('--crit'), INFO=col('--info'),
          ORANGE=col('--orange'), SLATE=col('--slate'), VIOLET=col('--violet'), INK=col('--ink');

    const R_STATUS = {  // status -> {color, glyph, label}
      confirmed:{c:GOOD,g:'✓'}, validated:{c:GOOD,g:'✓'}, met:{c:GOOD,g:'✓'},
      available:{c:GOOD,g:'✓'}, done:{c:GOOD,g:'✓'}, approved:{c:GOOD,g:'✓'},
      refuted:{c:CRIT,g:'✗'}, rejected:{c:CRIT,g:'✗'}, failed:{c:CRIT,g:'✗'}, creation_failed:{c:CRIT,g:'✗'},
      // Tested and not settled: neither a verdict nor an untouched branch.
      inconclusive:{c:ORANGE,g:'≈'},
      under_verification:{c:WARN,g:'⧗'}, running:{c:WARN,g:'⧗'}, obtained:{c:WARN,g:'●'}, draft:{c:WARN,g:'✎'},
      formulated:{c:INFO,g:'○'}, open:{c:INFO,g:'○'}, planned:{c:INFO,g:'○'}, not_met:{c:INFO,g:'○'},
      needs_adaptation:{c:ORANGE,g:'⚙'}, being_created:{c:ORANGE,g:'⚙'},
      postponed:{c:SLATE,g:'⏸'}, exhausted:{c:SLATE,g:'∅'}, decomposed:{c:SLATE,g:'⊟'}, closed:{c:SLATE,g:'●'},
      active:{c:VIOLET,g:'▮'}, created:{c:SLATE,g:'▢'},
      // The two derived cards: a summary, not a state anything moves through.
      derived:{c:SLATE,g:'▣'},
    };
    const rStatus = s => R_STATUS[s] || {c:SLATE,g:'•'};

    const R_ICON = { researchquestion:'❓', hypothesis:'💡', evidence:'🔬', conclusion:'✅',
      verificationmethod:'⚙️', confirmationcriteria:'🎯', tool:'🔧', resource:'🔋',
      empiricalbase:'🗄️', constraint:'⚖️', codeartifact:'💻', generateddata:'📦',
      report:'📑', publication:'📰', spec:'📋', efficiencyjustification:'📈',
      costmodel:'💰', efficiencymetric:'📊', framing:'🧩', outcome:'▣' };
    const R_LEVEL = { researchquestion:0, constraint:0, hypothesis:1, empiricalbase:1,
      verificationmethod:2, confirmationcriteria:2, tool:2,
      evidence:3, resource:3, generateddata:3, codeartifact:3, conclusion:4,
      report:5, publication:5, spec:5, efficiencyjustification:5, costmodel:5, efficiencymetric:5,
      framing:0, outcome:5 };
    const R_EDGE = { supports:GOOD, refutes:CRIT, refines:WARN,
      supersedes:SLATE, frames:SLATE, concludes:INFO };
    // Human-readable type names (shown as "Hypothesis 1" instead of the terse id
    // "H1") and edge phrases, so a first-time viewer instantly reads the graph.
    const R_TYPE_NAME = { researchquestion:"Question", hypothesis:"Hypothesis", evidence:"Evidence",
      conclusion:"Conclusion", verificationmethod:"Method", confirmationcriteria:"Criteria",
      tool:"Tool", resource:"Resource", empiricalbase:"Data source", constraint:"Constraint",
      codeartifact:"Code", generateddata:"Dataset", report:"Report", publication:"Publication",
      spec:"Spec", efficiencyjustification:"Efficiency", costmodel:"Cost model",
      efficiencymetric:"Metric", framing:"Framing", outcome:"Outcome" };
    const R_EDGE_NAME = { motivates:"motivates", tested_by:"tested by", requires:"requires",
      uses:"uses", consumes:"consumes", produces:"produces", supports:"supports", refutes:"refutes",
      refines:"refines", based_on:"based on", determines_sufficiency:"sufficiency for",
      formulated_for:"criterion for", regulates:"regulates", constrains:"constrains",
      derived_from:"derived from", contextualizes:"frames", defines_scope:"scope of",
      relates_to:"relates to", applies_to:"applies to", via:"via" };
    // The server now names the type and the status in the words a scientist
    // uses; the client keeps its own table only as a fallback for older data.
    const rTypeName = n => {
      if (n.type_word) return n.type_word;
      const key = "graph.type." + n.kind;
      return t(key, R_TYPE_NAME[n.kind] || n.kind || "");
    };
    const rStatusWord = n => n.status_word || String(n.status || "").replace(/_/g, " ");
    const RESEARCH_KINDS = new Set(Object.keys(R_LEVEL));
    // There is no client-side allow-list any more. What the canvas draws is
    // decided by the store, which folds the engineering record (tools, budget,
    // datasets, code) into the card it belongs to and re-points its edges. The
    // list that used to live here dropped those nodes AND every edge touching
    // one, which in a real session was every edge there was.
    // hex -> "r,g,b" for translucent fills
    function rgba(hex, a){ const m = hex.replace('#',''); const v = m.length===3
      ? m.split('').map(x=>parseInt(x+x,16)) : [0,2,4].map(i=>parseInt(m.slice(i,i+2),16));
      return `rgba(${v[0]},${v[1]},${v[2]},${a})`; }

    // ── execution view styling ────────────────────────────────────────────────
    // One tint per stretch of a run: enough to tell them apart behind the
    // cards, never enough to compete with a node's own status colour.
    const PHASE_FILL = {
      framing:    "rgba(59,130,246,0.07)",
      research:   "rgba(56,189,248,0.07)",
      experiment: "rgba(249,115,22,0.07)",
      report:     "rgba(34,197,94,0.07)",
    };
    const PHASE_EDGE = {
      framing:    "rgba(59,130,246,0.40)",
      research:   "rgba(56,189,248,0.40)",
      experiment: "rgba(249,115,22,0.40)",
      report:     "rgba(34,197,94,0.40)",
    };
    let lastPhases = [];

    const STATUS_COLOR = { running:"#f1c40f", success:"#22c55e", failed:"#ef4444", interrupted:"#e67e22", pruned:"#64748b" };
    // Identity fills the node; status rings it. Colouring agents by identity
    // alone made a stuck "running" agent look exactly like a finished one, so
    // the only nodes that showed progress were goals and tool calls.
    const IDENTITY_COLOR = { system:"#f4c542", agent:"#7eb6ff", agent_call:"#7eb6ff" };
    // Every node in the log is a labelled box. Dots, diamonds and stars made a
    // trace read as a diagram of shapes; a run reads better as a row of cards
    // whose text you can scan.
    const SHAPE = { system:"hexagon" };
    const statusColor = n => STATUS_COLOR[n.status] || "#cbd5e1";
    const colorOf = n => IDENTITY_COLOR[n.kind] || statusColor(n);
    const borderOf = n => IDENTITY_COLOR[n.kind] ? statusColor(n) : "#20232a";
    const shapeOf = n => SHAPE[n.kind] || "box";
    // How long it took, in the unit a reader thinks in: a sandbox run that
    // waited six hours is "5h 51m", not "21081.8s".
    const secsOf = n => {
      if (!(n.t_end && n.t_start)) return "";
      const s = n.t_end - n.t_start;
      if (s < 1) return s.toFixed(2) + "s";
      if (s < 60) return s.toFixed(1) + "s";
      if (s < 3600) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
      return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
    };
    // When the call was made. The canvas already places nodes along a time
    // axis, but reading a position off an axis is not the same as being told
    // the hour — and it is what a reader matches against a log line.
    const clockOf = n => {
      if (!n.t_start) return "";
      const d = new Date(n.t_start * 1000);
      const pad = v => String(v).padStart(2, "0");
      return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    };
    // Started at, then how long it took, on one line so a card stays two deep.
    const metaOf = n => [clockOf(n), secsOf(n)].filter(Boolean).join("  ·  ");
    // Kind first, then what it was, then when and how long: the things a
    // reader of a trace is after.
    function labelOf(n){
      const meta = metaOf(n);
      const tail = meta ? "\n" + meta : "";
      if (n.kind === "goal")
        return "❯ " + String(n.label || t('graph.detail.request')).slice(0, 90) + tail;
      if (n.kind === "result")
        return "✔ " + t('graph.detail.answer') + tail;
      if (n.kind === "agent" || n.kind === "agent_call") {
        // Numbered in the order the stages ran; an agent that ran more than
        // once in the request says which run this is, so a loop reads as one.
        // Its tool calls are folded into the card; the count says there is
        // something to open, and how much.
        const calls = Array.isArray(n.calls) ? n.calls.length : 0;
        const name = String(n.executor_agent || n.label || "").slice(0, 30);
        return (n.stage ? n.stage + ". " : "") + name
          + (n.runs > 1 ? "  (" + t('graph.detail.runOf', { run: n.run, runs: n.runs }) + ")" : "") + tail
          + (calls ? "\n🛠 " + t('graph.count.calls', { count: calls }) : "");
      }
      return String(n.label || n.id || "").slice(0, 30) + tail;
    }

    const isResearch = () => document.getElementById("view").value === "research";

    function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
    // For canvas labels ONLY — never for innerHTML, which still needs esc().
    //
    // vis-network 10.1.0 parses a multi:"html" label with its own tokenizer, and
    // the moment it meets an '&' it calls its two-argument replace() with three
    // arguments: the whole label becomes the pattern and is compiled as
    // `new RegExp(<the entire card text>)`. Any '(' or '[' left unbalanced by
    // the 190-character cut then throws SyntaxError — out of the node loop, so
    // the canvas stayed blank and every later poll threw on the same cached
    // label until the page was reloaded.
    //
    // Escaping to "&amp;" makes it strictly worse: agents write plain '&' too
    // ("Rassabina & Fedorov"). So no '&', '<' or '>' may reach the label at all;
    // the <b>/<i>/<code> we do want is added after this runs. Full-width '＆'
    // reads as an ampersand and is inert to the tokenizer.
    function visSafe(s){
      return String(s == null ? "" : s).replace(/[<>]/g, " ").replace(/&/g, "＆");
    }
    function rText(n){ return String(n.output||n.label||"").replace(/\s+/g," ").trim(); }
    // A card is a headline, not the document. Seven hundred characters of
    // formulation per node turned the canvas into a wall of prose nobody scans;
    // the whole text is one click away in the panel, so the card carries the
    // first sentence and the facts you scan for: what it is, how it stands, who
    // wrote it, and whether a tool call backs it.
    function firstSentence(text, cap){
      const trimmed = String(text || "").replace(/\s+/g, " ").trim();
      if (trimmed.length <= cap) return trimmed;
      const stop = trimmed.slice(0, cap).search(/[.!?;](?=\s|$)[^]*$/);
      const cut = trimmed.lastIndexOf(" ", cap);
      return trimmed.slice(0, stop > cap * 0.4 ? stop + 1 : (cut > 0 ? cut : cap)) + " …";
    }
    // Five lines, in the order a reader asks for them: WHAT this is and how it
    // stands, what it says, what it is checked by (or where it came from), what
    // it was built with, and who recorded it. A step that ended badly says WHY
    // on the card itself — that answer used to live in the store and never
    // reach the page, so a failed method drew as "не удался" and stopped there.
    function researchLabel(n){
      const st = rStatus(n.status), icon = R_ICON[n.kind] || "•";
      const idx = n.index && n.kind !== "researchquestion" ? " " + n.index : "";
      const sw = rStatusWord(n);
      const L = [];
      L.push("<b>" + visSafe(st.g + " " + icon + " " + rTypeName(n) + idx
                             + (sw ? " · " + sw : "")) + "</b>");
      // A headline, still — but a wider one than the cramped column layout
      // could afford. At 150 characters an observation was cut before its
      // numbers ("mean AD=59.7%; …"), which is the part a reader came for.
      const body = firstSentence(rText(n), 210);
      if (body) L.push(visSafe(body));
      if (n.why)
        L.push("<i>" + visSafe(st.g + " " + t('graph.why.title') + ": "
                               + firstSentence(n.why, 110)) + "</i>");
      else if (n.why_missing)
        L.push("<i>" + visSafe(t('graph.why.missing')) + "</i>");
      if (n.criterion)
        L.push(visSafe("🎯 " + t('graph.card.criterion') + " "
                       + firstSentence(n.criterion, 80)));
      else if (n.origin && n.origin.code !== "question")
        L.push("<i>" + visSafe(t('graph.origin.' + n.origin.code,
                                 { reason: n.origin.reason || "" })) + "</i>");
      if (n.chips && n.chips.length)
        L.push(n.chips.slice(0, 4)
               .map(c => "<code>" + visSafe(String(c.label || "").slice(0, 22)) + "</code>")
               .join(" "));
      const foot = [
        n.attachments && n.attachments.length
          ? "📎 " + t('graph.count.attached', { count: n.attachments.length }) : "",
        n.executor_agent ? shortAgent(n.executor_agent) : "",
        (n.provenance || []).length
          ? "🛠️ " + t('graph.count.calls', { count: n.provenance.length }) : "",
      ].filter(Boolean).join("  ·  ");
      if (foot) L.push("<i>" + visSafe(foot) + "</i>");
      return L.join("\n");
    }
    const shortAgent = a => String(a).replace(/Agent$/, "");
    // The tooltip used to print the raw identifiers — "type: hypothesis · status:
    // under_verification" — while the card beside it said the same thing in the
    // reader's own words. Research nodes carry those words from the server.
    const titleOf = n => [
      t('graph.tooltip.type', { kind: RESEARCH_KINDS.has(n.kind) ? rTypeName(n) : (n.kind || "") }),
      n.executor_agent ? t('graph.tooltip.source', { agent: n.executor_agent }) : "",
      t('graph.tooltip.status', { status: RESEARCH_KINDS.has(n.kind) ? rStatusWord(n) : (n.status || "") }),
      Array.isArray(n.calls) && n.calls.length ? t('graph.tooltip.toolCalls', { count: n.calls.length }) : "",
      n.why ? t('graph.why.title') + ": " + String(n.why).slice(0, 200) : "",
      n.output?String(n.output).slice(0,300):"" ].filter(Boolean).join("\n");

    // ══════════════════════════════════════════════════════════════════════════
    const nodes = new vis.DataSet([]);
    const edges = new vis.DataSet([]);
    let network = null;
    // The research bands the canvas paints behind the cards, newest layout wins.
    let stageBands = [];
    function makeNetwork(){
      const r = isResearch();
      if (network) network.destroy();
      network = new vis.Network(document.getElementById("net"), { nodes, edges }, {
        nodes: { borderWidth: 2, shadow: { enabled: true, color: "rgba(0,0,0,0.35)", size: 10, x: 0, y: 3 } },
        edges: { arrows: { to: { scaleFactor: 0.55 } }, color: { color: "#3a4150", highlight: "#64748b" },
                 font: { color: "#8b93a1", size: r ? 12 : 10, strokeWidth: 0 },
                 // The research graph now reads top to bottom through its stage
                 // bands, so its links bend the way they travel; the log still
                 // runs along a clock, left to right.
                 smooth: { type: "cubicBezier",
                           forceDirection: r ? "vertical" : "horizontal",
                           roundness: r ? 0.45 : 0.35 } },
        // Neither view lets vis place anything. The log is a timeline: every
        // node already carries the x its start time earns and the row of the
        // agent that ran it. The research graph is banded by stage, and a band
        // is a fact about the study — hierarchical layout would collapse both
        // back into columns of its own choosing.
        layout: { hierarchical: false, randomSeed: 1 },
        physics: { enabled: false },
        interaction: { hover: true, tooltipDelay: 120, navigationButtons: false },
      });
      // The stretches the request went through, painted behind the cards.
      // A band is not a node: it says nothing a card does not already say, it
      // just says where one stretch ended and the next began, which is the
      // thing you otherwise reconstruct by reading every name in order.
      network.on("beforeDrawing", ctx => {
        if (isResearch()) return drawStageBands(ctx);
        if (!lastPhases.length) return;
        const ys = Object.values(nodeData)
          .map(n => n.y).filter(v => typeof v === "number");
        if (!ys.length) return;
        const top = Math.min(...ys) - 90, bottom = Math.max(...ys) + 90;
        ctx.save();
        lastPhases.forEach(b => {
          const pad = 20;
          ctx.fillStyle = PHASE_FILL[b.phase] || "rgba(148,163,184,0.06)";
          ctx.fillRect(b.x0 - pad, top, (b.x1 - b.x0) + pad * 2, bottom - top);
          ctx.strokeStyle = PHASE_EDGE[b.phase] || "rgba(148,163,184,0.25)";
          ctx.lineWidth = 1;
          ctx.strokeRect(b.x0 - pad, top, (b.x1 - b.x0) + pad * 2, bottom - top);
          ctx.fillStyle = PHASE_EDGE[b.phase] || "#94a3b8";
          ctx.font = "600 22px -apple-system, Segoe UI, sans-serif";
          ctx.textBaseline = "bottom";
          ctx.fillText(b.label, b.x0 - pad + 12, top + 34);
        });
        ctx.restore();
      });
      network.on("click", params => {
        if (!params.nodes.length) { closeDetail(); return; }
        selectedId = params.nodes[0];
        focusCallId = null; focusPending = false;
        lastDetailStamp = JSON.stringify(nodeData[selectedId]);
        showDetail(nodeData[selectedId]);
      });
    }

    // ── stage bands ───────────────────────────────────────────────────────────
    // A study is read down the page by the stage that produced each card — what
    // was asked, what was read, what was tested, what came out — and across a
    // band by the epistemic level, so the two readings do not fight: down is
    // the work, across is the argument.
    //
    // This replaces vis's hierarchical layout for the research view. Its levels
    // are an x index, so one layer is one column and a study that recorded
    // eighteen observations put all eighteen in a single column four thousand
    // pixels tall; the fit that followed dropped to 0.21, and vis stops drawing
    // a label once fontSize × scale falls under its scaling.label.drawThreshold
    // of 5 — the canvas showed eighteen empty boxes. Unlinked cards made it
    // worse still: with no edge to hang on, each is its own tree and vis stacks
    // the trees down the y axis, so the column came out as a diagonal.
    const STAGE_ORDER = ["framing", "literature", "hypotheses", "report"];
    const STAGE_TINT = {
      framing:    { fill: "rgba(59,130,246,0.07)",  line: "rgba(59,130,246,0.42)" },
      literature: { fill: "rgba(56,189,248,0.07)",  line: "rgba(56,189,248,0.42)" },
      hypotheses: { fill: "rgba(249,115,22,0.07)",  line: "rgba(249,115,22,0.42)" },
      report:     { fill: "rgba(34,197,94,0.07)",   line: "rgba(34,197,94,0.42)" },
    };
    // The server names the stage; this is the fallback for a study archived
    // before it did, where the type is all there is to go on. Literature
    // evidence is indistinguishable from experimental evidence here — that
    // distinction lives in attrs.subtype, which the projection reads.
    const STAGE_BY_KIND = { framing: "framing", researchquestion: "framing",
      constraint: "framing", empiricalbase: "framing", resource: "framing",
      hypothesis: "hypotheses", verificationmethod: "hypotheses",
      confirmationcriteria: "hypotheses", tool: "hypotheses",
      evidence: "hypotheses", generateddata: "hypotheses", codeartifact: "hypotheses",
      conclusion: "report", outcome: "report", report: "report",
      publication: "report", efficiencyjustification: "report",
      costmodel: "report", efficiencymetric: "report" };
    const stageOf = n => {
      const s = n.stage || STAGE_BY_KIND[n.kind];
      return STAGE_TINT[s] ? s : "hypotheses";
    };
    // Nominal card pitch, used for the first pass and as the fallback when a
    // card has not been drawn yet and has no measured box.
    const LEVEL_SEPARATION = 400, NODE_PITCH = 240;
    // How wide a band runs before it wraps, and the breathing room around a
    // band's contents. Wide enough for six cards: past that the whole study
    // stops fitting a screen at a readable zoom.
    const BAND_WIDTH = 2160, BAND_PAD = 38, BAND_MIN_HEIGHT = 128;

    // The four stages, painted behind the cards as the rows of one page. A band
    // with nothing in it is still drawn: an empty "report" row says the study
    // has not got there yet, which is the question a reader opens the graph
    // with, and leaving it out made a study that had barely started look
    // finished.
    function drawStageBands(ctx){
      if (!stageBands.length) return;
      ctx.save();
      stageBands.forEach(b => {
        const tint = STAGE_TINT[b.stage] || { fill: "rgba(148,163,184,0.05)",
                                              line: "rgba(148,163,184,0.25)" };
        const w = b.right - b.left, h = b.bottom - b.top;
        ctx.fillStyle = b.count ? tint.fill : "rgba(148,163,184,0.03)";
        ctx.fillRect(b.left, b.top, w, h);
        ctx.strokeStyle = tint.line;
        ctx.lineWidth = 1;
        // A stage nobody has reached is outlined, not filled — the row is
        // there, the work is not.
        if (!b.count) ctx.setLineDash([7, 6]);
        ctx.strokeRect(b.left, b.top, w, h);
        ctx.setLineDash([]);
        ctx.fillStyle = tint.line;
        ctx.font = "600 26px -apple-system, Segoe UI, sans-serif";
        ctx.textBaseline = "top";
        const name = t('graph.stage.' + b.stage, b.stage);
        // Measured under the heading font, before the note switches it.
        const nameWidth = ctx.measureText(name).width;
        ctx.fillText(name, b.left + 16, b.top + 12);
        if (!b.count) {
          ctx.font = "400 20px -apple-system, Segoe UI, sans-serif";
          ctx.fillStyle = "rgba(148,163,184,0.55)";
          ctx.fillText(t('graph.stage.empty'), b.left + 26 + nameWidth, b.top + 15);
        }
      });
      ctx.restore();
    }

    // First pass, on nominal sizes: vis reports a real box only once it has
    // drawn a card, and it cannot draw one without a position.
    function layoutStages(list){
      const place = {};
      const byStage = new Map(STAGE_ORDER.map(s => [s, []]));
      list.forEach(n => byStage.get(stageOf(n)).push(n));
      const perRow = Math.max(1, Math.floor(BAND_WIDTH / LEVEL_SEPARATION));
      let y = 0;
      STAGE_ORDER.forEach(stage => {
        // Inside a band the epistemic level orders the cards, then the index —
        // question before hypothesis before method before observation.
        const group = byStage.get(stage).sort((a, b) =>
          ((a.level ?? 3) - (b.level ?? 3))
          || ((a.index || 0) - (b.index || 0))
          || String(a.id).localeCompare(String(b.id)));
        group.forEach((n, i) => {
          place[n.id] = { stage, order: i,
                          x: (i % perRow) * LEVEL_SEPARATION,
                          y: y + BAND_PAD + Math.floor(i / perRow) * NODE_PITCH };
        });
        y += Math.max(BAND_MIN_HEIGHT,
                      Math.ceil(group.length / perRow) * NODE_PITCH + BAND_PAD * 2);
      });
      return place;
    }

    // ── the research node card ────────────────────────────────────────────────
    function researchNode(n, place){
      const st = rStatus(n.status), c = st.c;
      const slot = place && place[n.id];
      const node = {
        id: n.id, title: titleOf(n), shape: "box", label: researchLabel(n),
        color: { background: rgba(c, 0.14), border: c,
                 highlight: { background: rgba(c, 0.22), border: c },
                 // Without an explicit hover vis falls back to its OWN default
                 // (#D2E5FF) and leaves the label at --ink #e8eaed: 1.07:1
                 // contrast, so the card went blank under the cursor and read as
                 // if the node had vanished.
                 hover: { background: rgba(c, 0.26), border: c } },
        font: { color: INK, size: 16, multi: "html",
                face: "-apple-system, Segoe UI, sans-serif", align: "left" },
        // Hovering must not re-typeset the label: labelHighlightBold redraws it
        // bold, which re-runs the parser over the very string that can throw.
        chosen: { node: true, label: false },
        borderWidth: n.virtual ? 1 : 2, shapeProperties: { borderRadius: 9 },
        widthConstraint: { minimum: 230, maximum: 340 }, margin: 12,
      };
      if (n.virtual) node.shapeProperties.borderDashes = [4, 3];
      // Every research card is pinned: the band it sits in is a fact about the
      // study, not something a layout engine may optimise away.
      if (slot) {
        const seat = pinned[n.id] || slot;
        node.x = seat.x; node.y = seat.y;
        node.fixed = { x: true, y: true };
      }
      return node;
    }

    // Second pass, on the boxes vis measured. Cards differ in width and in
    // height, so the nominal grid leaves ragged lanes of empty canvas; each
    // band flows its own cards left to right, wraps at BAND_WIDTH, and the next
    // band starts under the deepest row of this one. It also yields the band
    // rectangles the canvas paints behind the cards.
    const CARD_GAP = 28;
    let pinned = {}, pinnedFor = "";
    function reflowStages(place, signature){
      if (!place || pinnedFor === signature) return false;
      const sizeOf = id => {
        try {
          const box = network.getBoundingBox(id);
          if (box) return { w: box.right - box.left, h: box.bottom - box.top };
        } catch (err) { /* not drawn yet */ }
        return { w: LEVEL_SEPARATION - CARD_GAP, h: NODE_PITCH - CARD_GAP };
      };
      const byStage = new Map(STAGE_ORDER.map(s => [s, []]));
      Object.keys(place).forEach(id => {
        if (nodes.get(id)) byStage.get(place[id].stage).push(id);
      });
      const seats = {}, bands = [];
      // The bands hug the widest row there actually is, not the wrap width: a
      // study of six cards drawn inside 2160px of band ran the rows off the
      // side of the screen with nothing in them.
      let y = 0, widest = 0;
      STAGE_ORDER.forEach(stage => {
        const ids = byStage.get(stage)
          .sort((a, b) => place[a].order - place[b].order);
        const top = y;
        let x = 0, rowTop = y + BAND_PAD, rowHeight = 0, reach = 0;
        ids.forEach(id => {
          const { w, h } = sizeOf(id);
          if (x > 0 && x + w > BAND_WIDTH) {        // wrap within the band
            x = 0; rowTop += rowHeight + CARD_GAP; rowHeight = 0;
          }
          seats[id] = { x: x + w / 2, y: rowTop + h / 2 };
          x += w + CARD_GAP;
          reach = Math.max(reach, x - CARD_GAP);
          rowHeight = Math.max(rowHeight, h);
        });
        const filled = ids.length ? (rowTop + rowHeight) - (top + BAND_PAD) : 0;
        const height = Math.max(BAND_MIN_HEIGHT, filled + BAND_PAD * 2);
        widest = Math.max(widest, reach);
        bands.push({ stage, top, bottom: top + height, count: ids.length });
        y = top + height;
      });
      // One width for every band, so they read as stacked rows of one page
      // rather than four unrelated boxes.
      bands.forEach(b => { b.left = -BAND_PAD; b.right = widest + BAND_PAD; });
      stageBands = bands;
      pinned = seats; pinnedFor = signature;
      nodes.update(Object.keys(seats).map(id => ({ id, ...seats[id] })));
      return true;
    }

    // ══════════════════════════════════════════════════════════════════════════
    const nodeData = {};
    let lastGraph = { nodes: [], edges: [] };
    let fitted = false;
    async function poll(){
      try {
        const params = new URLSearchParams(location.search);
        const userId = params.get("user_id") || "";
        const sessionId = params.get("session_id") || "";
        if (!userId || !sessionId) {
          throw new Error(t('graph.noSession'));
        }
        // The same picker serves both views: a request in the log, a study in
        // the research graph. Its value is cleared on a view change, so one
        // view's selection can never be sent to the other.
        const chosenTurn = document.getElementById("turn").value;
        const url = `/api/users/${encodeURIComponent(userId)}/sessions/${encodeURIComponent(sessionId)}`
          + `/graph?view=${encodeURIComponent(document.getElementById("view").value)}`
          + (chosenTurn ? `&turn=${encodeURIComponent(chosenTurn)}` : "")
          // Card words (type, status) are projected on the server in the
          // language of the page's own switch.
          + `&lang=${encodeURIComponent(typeof currentLang !== "undefined" ? currentLang : "ru")}`;
        const r = await fetch(url, { cache: "no-store" });
        if (!r.ok) throw new Error(t('graph.error.http', { status: r.status }));
        const g = await r.json(); lastGraph = g;
        // The API answers ANY failure with HTTP 200 and {"nodes": [], "edges":
        // [], "error": "..."} so it never breaks the page. Unread, that is
        // indistinguishable from a study nobody has written to yet.
        if (g.error) throw new Error(t('graph.error.server', { error: g.error }));
        const research = isResearch();
        lastPhases = research ? [] : (g.phases || []);
        // The log is drawn one request at a time; the payload lists the rest.
        const turnWrap = document.getElementById("turnWrap"),
              turnSel = document.getElementById("turn"),
              turnLabel = document.getElementById("turnLabel");
        const choices = research
          ? (g.studies || []).map(x => ({
              id: x.study_id,
              text: (x.live ? t('graph.choice.live') + " · " : t('graph.choice.archived') + " · ")
                    + (x.label || t('graph.choice.study'))
                    + ` (${x.node_count})` }))
          : (g.turns || []).map((turn, i) => ({
              id: turn.turn_id, text: `${i + 1}. ${turn.prompt || t('graph.turn.request')}` }));
        const current = research ? g.study_id : g.turn_id;
        if (choices.length) {
          turnWrap.style.display = "";
          turnLabel.textContent = research ? t('graph.turn.study') : t('graph.turn.request');
          const want = choices.map(c => c.id).join("|");
          if (turnSel.dataset.keys !== want) {
            turnSel.dataset.keys = want;
            turnSel.innerHTML = choices.map(c =>
              `<option value="${esc(c.id)}">${esc(String(c.text).slice(0, 64))}</option>`
            ).join("");
          }
          if (current) turnSel.value = current;
        } else { turnWrap.style.display = "none"; }
        // What gets drawn is the SERVER's decision now. The client used to hold
        // its own allow-list of node kinds and drop the rest — and with them
        // every edge that touched one. In a real session the whole structure of
        // the research graph hung off dataset nodes that were not on that list,
        // so 100% of the edges were discarded and the canvas drew a field of
        // unconnected cards. The store folds those into the card they belong to
        // instead, and re-points their edges, so nothing is lost either way.
        // Depth in the execution tree. Set explicitly rather than inferred from
        // the arrows: an agent node is shared by every turn that called it, so
        // inference would drag it to whatever depth the first caller had and
        // bend the tree around it. Siblings are inserted in start order, which
        // is how vis lays them out left to right, so reading across a level
        // reads forward in time.
        // Already ordered by (level, start time) upstream; siblings enter in the
        // order they ran, which is the order vis lays them out.
        const ordered = g.nodes || [];
        // Decided once for the whole payload: placing a card needs to see how
        // many others share its band, which a per-node call cannot.
        const place = research ? layoutStages(ordered) : null;
        // One update call per poll, not one per node: physics is off, so every
        // single update() drags a full hierarchical re-layout and a synchronous
        // redraw behind it.
        const batchNodes = [], batchEdges = [];
        const liveNodes = new Set(), liveEdges = new Set();
        ordered.forEach(n => {
          try {
          nodeData[n.id] = n; liveNodes.add(n.id);
          if (research) { batchNodes.push(researchNode(n, place)); }
          else {
            // Cards, sized by what they are: the request opens the row, agents
            // carry it, calls are the detail. Status is the border, identity the
            // fill, so a failed call is visible without reading its label.
            const isRoot = n.kind === "system";
            const isAgent = n.kind === "agent" || n.kind === "agent_call";
            const isGoal = n.kind === "goal", isResult = n.kind === "result";
            const c = colorOf(n);
            const node = { id:n.id, title:titleOf(n), label:labelOf(n), shape:shapeOf(n),
              margin: { top:9, bottom:9, left:12, right:12 },
              // Fixed, and the same number the server packs lanes with
              // (projection._CARD_WIDTH). If the two disagree the cards overlap.
              widthConstraint: { minimum: (n.card_width || 190) - 26,
                                 maximum: (n.card_width || 190) - 26 },
              color:{ background: rgba(c, isGoal || isResult ? 0.22 : 0.16),
                      border: borderOf(n) === "#20232a" ? c : borderOf(n),
                      highlight: { background: rgba(c, 0.32), border: c },
                      // Same default-hover trap as the research card: without
                      // this the box turns pale blue under a near-white label.
                      hover: { background: rgba(c, 0.30), border: c } },
              borderWidth: 2,
              chosen: { node: true, label: false },
              font:{ color:"#e8eaed", multi:false, align:"left",
                     size: isGoal?17:(isAgent?16:13), strokeWidth:0 } };
            // Position comes from the server: x from when the call started, y
            // from whose lane it belongs to. Pinned, so the picture stays put
            // while it is being read and stretches as the run goes on.
            if (n.x != null && n.y != null) {
              node.x = n.x; node.y = n.y;
              node.fixed = { x: true, y: true };
            }
            if (isGoal) { node.borderWidth = 3; node.font.color = "#ffffff"; }
            else if (isRoot) { node.borderWidth = 3; node.color.border = "#38bdf8"; }
            batchNodes.push(node);
          }
          } catch (err) {
            // One card must never cost the drawing. Put it up under its own id
            // so the reader can still see and click the node, and say what
            // happened in its tooltip.
            console.warn("graph node", n && n.id, err);
            try {
              liveNodes.add(n.id);
              batchNodes.push({ id: n.id, label: String(n.id), shape: "box",
                                title: String(err && err.message || err) });
            } catch (ignored) { /* the id itself was unusable */ }
          }
        });
        // Only redraw the panel when the node it shows has actually changed.
        // It was rebuilt on every poll, which threw away the scroll position:
        // reading down a long tool result, the box snapped back to the top
        // every 1.5 seconds.
        if (selectedId && nodeData[selectedId]) {
          const stamp = JSON.stringify(nodeData[selectedId]);
          if (stamp !== lastDetailStamp) {
            lastDetailStamp = stamp;
            showDetail(nodeData[selectedId]);
          }
        }
        (g.edges || []).forEach(e => {
          try {
          if (!e.src || !e.dst) return;
          const id = e.src + "->" + e.dst + ":" + (e.type||"");
          liveEdges.add(id);
          // human-readable edge label ("tested by", "criterion for", …) in research
          const ekey = "graph.edge." + e.type;
          const rlabel = research ? t(ekey, R_EDGE_NAME[e.type] || e.type || "") : (e.type || "");
          const edge = { id, from:e.src, to:e.dst, label: e.provenance ? "" : rlabel };
          // A link inside one band joins two cards on the same row, and a
          // bezier told to bend vertically between them draws a straight line
          // straight through everything in between — the evidence that supports
          // a hypothesis six cards to its left cut across four other cards. Arc
          // those; keep the vertical bend for the links that really do travel
          // down the page from one stage to the next.
          if (research && place) {
            const a = place[e.src], b = place[e.dst];
            if (a && b && a.stage === b.stage)
              edge.smooth = { type: "curvedCW", roundness: 0.22 };
          }
          if (e.synthetic) { edge.color={color:"#2c313a",highlight:"#3a4150"}; edge.dashes=true; edge.width=1; edge.arrows=""; edge.label=""; }
          else if (research) { const c=R_EDGE[e.type];
            edge.color={color:c||"#4a5160",highlight:c||"#64748b"}; edge.width=c?3:1.5;
            edge.font={color:c||"#aeb6c2",size:12,strokeWidth:4,strokeColor:"#14161a"}; }
          // How the study MOVED: the verdict that retired one hypothesis and
          // the change that produced the next. Without the label this is just
          // an unexplained arrow between two look-alike cards.
          if (research && e.type === "supersedes") {
            const v = (e.attrs || {}).verdict || "other";
            const c = v === "refuted" ? CRIT : v === "confirmed" ? GOOD : WARN;
            edge.dashes = [5, 4]; edge.width = 1.8;
            edge.color = { color: c, highlight: c, hover: c };
            edge.font = { color: c, size: 12, strokeWidth: 4, strokeColor: "#14161a" };
            edge.label = t('graph.edge.supersedes.' + v,
                           { reason: (e.attrs || {}).reason || "" });
          } else if (research && e.rerouted) {
            // The link ran through something folded into a card. Drawn thinner
            // so it reads as inferred, and the tooltip names what it went via.
            edge.dashes = [2, 3]; edge.width = 1;
            edge.title = t('graph.edge.via', { node: e.via || "" });
          }
          batchEdges.push(edge);
          } catch (err) { console.warn("graph edge", e && e.src, err); }
        });
        // Two calls instead of 2N, and only now — a throw above cost the whole
        // drawing when each node updated the DataSet on its own.
        if (batchNodes.length) nodes.update(batchNodes);
        if (batchEdges.length) edges.update(batchEdges);
        // Reconciliation: what the server no longer sends must leave the canvas.
        // Nothing was ever removed, so a node that changed id, moved into
        // another card or belonged to a study the reader switched away from
        // stayed on screen until the page was reloaded.
        const goneNodes = nodes.getIds().filter(id => !liveNodes.has(id));
        if (goneNodes.length) {
          nodes.remove(goneNodes);
          goneNodes.forEach(id => { delete nodeData[id]; });
          if (selectedId && goneNodes.indexOf(selectedId) !== -1) closeDetail();
        }
        const goneEdges = edges.getIds().filter(id => !liveEdges.has(id));
        if (goneEdges.length) edges.remove(goneEdges);
        // Frame the study once it first has something to show. Research only:
        // execution cards are pinned at server-given coordinates and a fit
        // would drag the camera away from the part of the run in progress.
        if (research && batchNodes.length) {
          // A card's size depends on its text and its status, so the reflow is
          // redone when either changes and skipped when neither has —
          // otherwise every poll would nudge the whole page under a reader's
          // cursor. The stage is in the signature too: a method that moves to
          // the literature band changes every band below it.
          const signature = ordered
            .map(n => [n.id, n.status, stageOf(n), String(n.output || "").length]
                        .join(":"))
            .join("|");
          network.once("afterDrawing", () => {
            const reflowed = reflowStages(place, signature);
            if (fitted) return;
            fitted = true;
            // The reflow moves every card, and the boxes frameStudy measures
            // are a frame behind it — so the frame waits for the redraw the
            // reflow just scheduled instead of measuring where cards used to be.
            if (reflowed) network.once("afterDrawing", frameStudy);
            else frameStudy();
          });
        }
        if (research) renderHeader(g);
        else revealWantedCall();
        // A research graph outlives one prompt, so a session can be showing a
        // study that has not moved since yesterday. Say when it last changed;
        // otherwise "the new run produced nothing" looks like a stale view.
        let age = "";
        if (research && g.updated_at) {
          const mins = (Date.now() / 1000 - g.updated_at) / 60;
          age = mins < 2 ? t('graph.age.justNow')
             : mins < 90 ? t('graph.age.min', { mins: Math.round(mins) })
             : mins < 60 * 36 ? t('graph.age.hours', { hours: Math.round(mins / 60) })
             : t('graph.age.date', { date: new Date(g.updated_at * 1000).toLocaleString() });
        }
        document.getElementById("status").textContent = t('graph.status', {
          nodes: (g.nodes||[]).length, edges: (g.edges||[]).length
        }) + age;
      } catch (err) { document.getElementById("status").textContent = t('graph.error', { error: err }); }
    }

    // ── framing the study ─────────────────────────────────────────────────────
    // A plain fit is not enough. vis stops drawing a label once fontSize ×
    // scale falls under its scaling.label.drawThreshold of 5, so a study too
    // big for the window came back as a field of blank boxes: the fit had
    // zoomed to 0.21 and taken every word on the canvas with it. Below the
    // readable floor the study is panned, not shrunk — it opens at its
    // beginning, which is where a reader starts anyway, and the wheel is still
    // there for anyone who wants the whole shape at a glance.
    const MIN_READABLE_SCALE = 0.55;    // a 16px card font ≈ 9px on screen
    function frameStudy(){
      try {
        const ids = nodes.getIds();
        if (!ids.length) return;
        // Cards, not centres: getPositions() returns the middle of a card, and
        // a card is up to 340 wide and as tall as its text made it.
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        ids.forEach(id => {
          let box = null;
          try { box = network.getBoundingBox(id); } catch (err) { /* undrawn */ }
          if (!box) return;
          x0 = Math.min(x0, box.left); x1 = Math.max(x1, box.right);
          y0 = Math.min(y0, box.top);  y1 = Math.max(y1, box.bottom);
        });
        // The bands are part of the picture — an empty "report" row is the
        // answer to "how far has this got" — so the frame has to hold them too,
        // or the camera centres on the cards and cuts the row off.
        stageBands.forEach(b => {
          x0 = Math.min(x0, b.left); x1 = Math.max(x1, b.right);
          y0 = Math.min(y0, b.top);  y1 = Math.max(y1, b.bottom);
        });
        if (!(x1 > x0 && y1 > y0)) { network.fit({ animation: false }); return; }
        const canvas = document.getElementById("net");
        // The header floats over the canvas — by design, so the canvas stays
        // draggable under it — so the study is framed into the band left below
        // it. A plain fit() centres on the whole canvas and slides the first
        // row of cards under the question.
        const top = (document.getElementById("head").offsetHeight || 0) + 16;
        const padX = 40, padY = 24;
        const availW = Math.max(160, canvas.clientWidth - padX * 2);
        const availH = Math.max(160, canvas.clientHeight - top - padY);
        // Never past the point where vis stops drawing a label (fontSize ×
        // scale under its drawThreshold of 5): a study bigger than the band is
        // panned, not shrunk into eighteen blank boxes. Never magnified past
        // 1:1 either — a two-card study blown up to fill the screen reads as a
        // poster, not as a graph.
        const scale = Math.max(MIN_READABLE_SCALE,
          Math.min(1, availW / (x1 - x0), availH / (y1 - y0)));
        // Centred across, and hung from the top of the band: a reader starts at
        // the question, so that is what must be on screen.
        network.moveTo({ scale: scale, position: {
          x: (x0 + x1) / 2,
          y: y0 + (canvas.clientHeight / 2 - top) / scale,
        } });
      } catch (err) { /* no nodes yet */ }
    }

    // ── header ────────────────────────────────────────────────────────────────
    // The question itself is the header. The status tiles that stood under it
    // were a second legend — a count per hypothesis state — and the states are
    // already on the nodes, in colour and in words.
    // The question, how its branches stand, and what the record is missing.
    // The tally is the one thing a reader wants before reading any card: how
    // much of this study is settled. The gaps line is the other half of that —
    // an empty canvas used to mean three different things (nobody wrote
    // anything / the writes were refused / the request failed) and looked
    // identical in all three.
    // What the study holds, by the type the cards are labelled with, plus the
    // records folded into them — a dataset or a script is still part of the
    // count even when it is drawn as a chip on its observation rather than as
    // a card of its own.
    function inventoryTiles(g){
      const byKind = {}, word = {};
      let folded = 0;
      (g.nodes || []).forEach(n => {
        byKind[n.kind] = (byKind[n.kind] || 0) + 1;
        // rTypeName, so a tile is worded exactly like the cards it counts. The
        // client's own table calls Evidence "Данные" where the server says
        // "Свидетельство", and a header that renames what it counts reads as a
        // second, different tally.
        if (!word[n.kind]) word[n.kind] = rTypeName(n);
        folded += (n.attachments || []).length + (n.chips || []).length;
      });
      const tiles = Object.keys(byKind)
        .sort((a, b) => byKind[b] - byKind[a])
        // "18 × Свидетельство" rather than "18 Свидетельство": the server
        // words a type in the singular, and neither language declines it here.
        .map(kind => `<span class="tile" style="color:${INK};border-color:${rgba(SLATE,.5)}">`
          + `${R_ICON[kind] || "•"} ${byKind[kind]} × ${esc(word[kind] || kind)}</span>`);
      if (folded)
        tiles.push(`<span class="tile" style="color:${col('--ink2')};border-color:${rgba(SLATE,.5)}">`
          + `📎 ${esc(t('graph.count.attached', { count: folded }))}</span>`);
      return tiles.join("");
    }
    // Who produced the record, and over what stretch of time. A reader asking
    // "where did this come from" is asking about the agent, and the answer was
    // only ever visible one card at a time.
    function contributorLine(g){
      const list = g.nodes || [];
      if (!list.length) return "";
      const agents = {};
      let from = Infinity, to = 0;
      list.forEach(n => {
        if (n.executor_agent) agents[n.executor_agent] = (agents[n.executor_agent] || 0) + 1;
        if (n.t_start) from = Math.min(from, n.t_start);
        if (n.t_end || n.t_start) to = Math.max(to, n.t_end || n.t_start);
      });
      const who = Object.keys(agents).sort((a, b) => agents[b] - agents[a])
        .map(a => `${esc(shortAgent(a))} ${agents[a]}`).join("  ·  ");
      const span = (from < Infinity && to > from)
        ? t('graph.header.span', {
            from: new Date(from * 1000).toLocaleString(),
            mins: Math.max(1, Math.round((to - from) / 60)) }) : "";
      return [who, esc(span)].filter(Boolean).join("　—　");
    }
    function renderHeader(g){
      const head = (g && g.headline) || {};
      const qText = head.question || "";
      const qEl = document.getElementById("question");
      // Clamped to three lines in CSS, so the whole question has to be reachable
      // somewhere: the tooltip carries it verbatim.
      qEl.title = qText;
      qEl.innerHTML = qText
        ? `<span class="q">❓ ${esc(head.root_id || "")}</span> · ${esc(qText)}` : "";

      const c = (g && g.counters) || {};
      let tiles = [["confirmed", "✓", GOOD], ["refuted", "✗", CRIT],
                   ["under_verification", "⧗", WARN], ["inconclusive", "≈", ORANGE],
                   ["formulated", "○", INFO], ["postponed", "⏸", SLATE]]
        .filter(([key]) => c[key])
        .map(([key, glyph, col]) =>
          `<span class="tile" style="color:${col};border-color:${rgba(col,.35)}">`
          + `${glyph} ${c[key]} ${esc(t('graph.counters.' + key))}</span>`).join("");
      // The hypothesis tally is empty until a study has hypotheses, and a run
      // that only gathered observations has none — so the header went blank and
      // left the three orange "missing" chips as the only thing above the
      // canvas. A study of eighteen observations is not an empty study: say
      // what it does hold, counted by the type a reader sees on the cards.
      if (!tiles) tiles = inventoryTiles(g);
      document.getElementById("counters").innerHTML = tiles;

      const meta = head.iterations
        ? esc(t('graph.header.meta', { branches: head.branches || 1,
                                       iterations: head.iterations }))
        : contributorLine(g);
      document.getElementById("meta").innerHTML = meta;

      document.getElementById("gaps").innerHTML = ((g && g.gaps) || [])
        .map(x => `<span class="gap">${esc(t('graph.gap.' + x.code,
                                             { count: x.count }))}</span>`).join("");
    }
    function updateChrome(){
      const r = isResearch();
      document.getElementById("head").classList.toggle("hidden", !r);
      document.getElementById("net").style.top = "46px";
    }

    // ── detail panel (with provenance) ────────────────────────────────────────
    let selectedId = null;
    // Opening a card is where the short line on the canvas becomes the account
    // of a step: what it says, why it ended the way it did, how it got there,
    // what it produced and what it connects to. The panel used to render the
    // attributes flat (a nested object came out as "[object Object]"), showed
    // provenance for evidence alone, and rewrote itself through innerHTML on
    // every 1.5-second poll, so a long read snapped back to the top.
    function showDetail(n){
      if (!n) return;
      if (!isResearch() && !RESEARCH_KINDS.has(n.kind)) return showDetailClassic(n);
      const st = rStatus(n.status);
      let body = "";
      body += reportBlock(t('graph.detail.says'), n.output || n.label);
      if (n.why)
        body += `<div class="k">${t('graph.why.title')}</div><pre>${esc(n.why)}</pre>`;
      else if (n.why_missing)
        body += `<div class="k">${t('graph.why.title')}</div>`
              + `<div class="empty">${esc(t('graph.why.missing'))}</div>`;
      body += readable(t('graph.detail.details'), n.input);
      body += historyBlock(n.status_history);
      body += attachmentsBlock(n.chips, t('graph.chips.tools'));
      body += attachmentsBlock(n.attachments, t('graph.attach.title'));
      body += linksBlock(n.id);
      body += provBlock(n.provenance);
      if (!body) body = `<div class="empty">${esc(t('graph.detail.empty'))}</div>`;
      const head = `<div class="dhead"><span class="close" onclick="closeDetail()">✕</span>`
        + `<h3>${R_ICON[n.kind]||"•"} ${esc(rTypeName(n))}${n.index ? " " + n.index : ""}</h3>`
        + `<div class="sub">${esc(n.id)}${n.executor_agent ? esc(" · " + t('graph.detail.by', { agent: n.executor_agent })) : ""}</div>`
        + `<span class="badge" style="background:${rgba(st.c,.18)};color:${st.c};border:1px solid ${st.c}">${st.g} ${esc(rStatusWord(n))}</span></div>`;
      paint(n, head + `<div class="dbody">${body}</div>`);
    }
    // How it got here: every move, who made it and what they gave as the reason.
    function historyBlock(history){
      if (!Array.isArray(history) || !history.length) return "";
      return `<div class="k">${t('graph.history.title')}</div>`
        + history.map(h => {
            const line = h.from
              ? t('graph.history.entry', { from: h.from_word || h.from,
                                           to: h.to_word || h.to,
                                           source: h.source || "" })
              : t('graph.history.initial', { status: h.to_word || h.to || "" });
            const when = h.at ? new Date(h.at * 1000).toLocaleString() : "";
            return `<div class="prov"><span class="tool">${esc(line)}</span>`
              + (when ? `<span class="jump">${esc(when)}</span>` : "")
              + (h.reason ? `<div class="res">${esc(h.reason)}</div>` : "") + `</div>`;
          }).join("");
    }
    // The engineering the card folded in: the tools it ran on, the datasets and
    // code it produced. Drawn as boxes they buried the findings; dropped, they
    // took their edges with them. Here they are, with a link where there is one.
    function attachmentsBlock(list, title){
      if (!Array.isArray(list) || !list.length) return "";
      return `<div class="k">${esc(title)} <span class="chars">${list.length}</span></div>`
        + list.map(a => {
            const label = esc(a.label || a.id || "");
            const name = a.href
              ? `<a class="uri" href="${esc(a.href)}" target="_blank" rel="noopener noreferrer">${label}</a>`
              : `<span class="uri">${label}</span>`;
            return `<div class="art"><span class="ic">${R_ICON[a.kind] || "📦"}</span>${name}`
              + (a.type_word ? `<span class="by">${esc(a.type_word)}</span>` : "") + `</div>`;
          }).join("");
    }
    // What this card connects to, in words, and clickable — following a link by
    // eye across a wide canvas is exactly what a graph should spare you.
    function linksBlock(id){
      const rows = (lastGraph.edges || []).filter(e => e.src === id || e.dst === id)
        .map(e => {
          const out = e.src === id, other = out ? e.dst : e.src;
          if (!nodeData[other]) return "";
          const verb = t("graph.edge." + e.type, R_EDGE_NAME[e.type] || e.type || "");
          const dir = out ? t('graph.links.out') : t('graph.links.in');
          return `<div class="prov" onclick="focusNode('${esc(String(other))}')">`
            + `<span class="tool">${esc(dir)} · ${esc(verb)}</span>`
            + `<span class="jump">${esc(rTypeName(nodeData[other]))} ${esc(other)}</span>`
            + `<div class="res">${esc(firstSentence(rText(nodeData[other]), 110))}</div></div>`;
        }).filter(Boolean).join("");
      return rows ? `<div class="k">${t('graph.links.title')}</div>${rows}` : "";
    }
    // Which tool calls back this record. No longer gated on evidence: a method
    // and a conclusion are judged on their trace too.
    function provBlock(prov){
      if (!Array.isArray(prov) || !prov.length) return "";
      return `<div class="k">${t('graph.detail.provenance')}</div>` + prov.map(p => {
        const jump = p.exec_id ? ` onclick="jumpToExecution('${esc(String(p.exec_id))}')" title="${esc(t('graph.detail.openInLog'))}"` : "";
        return `<div class="prov"${jump}><span class="tool">🛠️ ${esc(p.tool||t('graph.detail.call'))}</span>`
          + (p.exec_id ? `<span class="jump">${esc(t('graph.detail.execLog'))}</span>` : "")
          + (p.result ? `<div class="res">${esc(p.result)}</div>` : "") + `</div>`;
      }).join("");
    }
    function focusNode(id){
      if (!nodeData[id]) return;
      selectedId = id; lastDetailStamp = JSON.stringify(nodeData[id]);
      try { network.selectNodes([id]); network.focus(id, { scale: 1.0, animation: true }); }
      catch (err) { /* the node may not be on the canvas yet */ }
      showDetail(nodeData[id]);
    }
    // ── readable values ──────────────────────────────────────────────────────
    // What an agent or a tool was given and what it returned is recorded three
    // ways, depending on the age of the snapshot: an object, a JSON string, or
    // the recorder's "key: value" lines. All three come back as one object so
    // the panel can lay them out as labelled rows instead of a wall of braces.
    let salvaged = false;   // set by parseValue when a cut JSON value was repaired
    function parseValue(v){
      salvaged = false;
      if (v === null || v === undefined) return null;
      if (typeof v === "object") return v;
      if (typeof v !== "string") return v;
      const s = v.trim();
      if (!s) return null;
      if (/^[\[{]/.test(s)) {
        try { return JSON.parse(s); } catch (e) {}
        const saved = salvageJSON(s);
        if (saved !== null) { salvaged = true; return saved; }
      }
      // Argument names, not prose: "Note: …" at the top of an answer is text.
      const KEY = /^([a-z_][a-z0-9_.-]{0,40}):(?:\s(.*))?$/;
      const lines = s.split("\n");
      if (!KEY.test(lines[0])) return s;
      const obj = {}; let key = null;
      for (const line of lines) {
        const m = line.match(KEY);
        if (m) { key = m[1]; obj[key] = m[2] === undefined ? "" : m[2]; }
        else obj[key] += (obj[key] ? "\n" : "") + line.replace(/^  /, "");
      }
      for (const k in obj) {
        const t = String(obj[k]).trim();
        if (/^[\[{]/.test(t)) { try { obj[k] = JSON.parse(t); } catch (e) {} }
      }
      return obj;
    }
    // The recorder keeps the first N characters of a value and says how many
    // it dropped. A JSON dump cut that way no longer parses, and a wall of
    // braces was the thing the panel is here to replace, so the open strings
    // and brackets are closed and, failing that, the text is backed off to the
    // last whole element until what is left parses. The note on how much was
    // dropped stays; see truncationNote().
    const CUT_MARK = /\n?… \[(\d+) more characters\]\s*$/;
    function salvageJSON(s){
      let text = s.replace(CUT_MARK, "");
      for (let attempt = 0; attempt < 60; attempt++) {
        try { return JSON.parse(closeOpen(text)); } catch (e) {}
        const cut = Math.max(text.lastIndexOf(","), text.lastIndexOf("{"),
                             text.lastIndexOf("["), text.lastIndexOf(":"));
        if (cut <= 0) return null;
        text = text.slice(0, cut);
      }
      return null;
    }
    function closeOpen(text){
      const stack = []; let inStr = false, escaped = false;
      for (const ch of text) {
        if (inStr) {
          if (escaped) escaped = false;
          else if (ch === "\\") escaped = true;
          else if (ch === '"') inStr = false;
          continue;
        }
        if (ch === '"') inStr = true;
        else if (ch === "{" || ch === "[") stack.push(ch === "{" ? "}" : "]");
        else if (ch === "}" || ch === "]") stack.pop();
      }
      let out = inStr ? text + '"' : text;
      out = out.replace(/,\s*$/, "").replace(/"(?:[^"\\]|\\.)*"\s*:\s*$/, "").replace(/,\s*$/, "");
      return out + stack.reverse().join("");
    }
    function truncationNote(value, repaired){
      const m = typeof value === "string" ? value.match(CUT_MARK) : null;
      if (m) {
        const kept = value.length - m[0].length;
        return `<div class="empty" style="margin-top:6px">`
          + esc(t('graph.detail.truncated', { kept: kept.toLocaleString(), dropped: Number(m[1]).toLocaleString() }))
          + `</div>`;
      }
      // Cut by a recorder that left no marker: only the repair says so.
      return repaired ? `<div class="empty" style="margin-top:6px">${esc(t('graph.detail.cutShort'))}</div>` : "";
    }
    // Bookkeeping fields nobody reads, and values already said once.
    const NOISE_KEYS = new Set(["is_root", "routing", "run_id", "semantic", "verdict",
                                "parent_ids", "turn_id"]);
    const isScalar = x => x === null || typeof x !== "object";
    const isEmpty = v => v === null || v === undefined || v === ""
      || (Array.isArray(v) && !v.length)
      || (typeof v === "object" && !Array.isArray(v) && !Object.keys(v).length);
    function tidy(obj, ctx){
      const out = {}, seen = new Set();
      for (const [k, v] of Object.entries(obj)) {
        if (NOISE_KEYS.has(k) || isEmpty(v)) continue;
        if (k === "name" && ctx && ctx.agent && v === ctx.agent) continue; // the heading says it
        const sig = isScalar(v) ? String(v) : JSON.stringify(v);
        if (seen.has(sig)) continue;                        // "role" repeating "description"
        seen.add(sig); out[k] = v;
      }
      return out;
    }
    function kvRows(obj, depth){
      return `<div class="kv">` + Object.entries(obj).map(([k, v]) => {
        const key = `<span class="key">${esc(k)}</span>`;
        if (!isScalar(v)) {
          if (Array.isArray(v) && v.every(x => isScalar(x) && String(x).length <= 40))
            return `<div class="row">${key}<span class="val">`
              + v.map(x => `<span class="pill">${esc(x)}</span>`).join("") + `</span></div>`;
          const count = Array.isArray(v) ? t('graph.count.item', { count: v.length })
                                         : t('graph.count.field', { count: Object.keys(v).length });
          return `<div class="row">${key}<span class="val dim">${count}</span>`
            + `<div class="nested">${nestedValue(v, depth + 1)}</div></div>`;
        }
        const text = String(v);
        const long = text.length > 90 || text.includes("\n");
        return `<div class="row">${key}<span class="val${long ? " block" : ""}">${esc(text)}</span></div>`;
      }).join("") + `</div>`;
    }
    function nestedValue(v, depth){
      if (depth > 4) return `<pre>${esc(JSON.stringify(v, null, 2))}</pre>`;
      if (Array.isArray(v))
        return `<ol class="items">` + v.map(x =>
          `<li>${isScalar(x) ? esc(x) : nestedValue(x, depth)}</li>`).join("") + `</ol>`;
      return kvRows(v, depth);
    }
    // A titled block: labelled rows for a mapping, a list for a list, the text
    // itself for prose, and nothing at all when there is nothing to show.
    function readable(title, value, ctx){
      const v = parseValue(value), repaired = salvaged;
      if (v === null) return "";
      let body;
      if (Array.isArray(v)) body = nestedValue(v, 0);
      else if (typeof v === "object") {
        const t = tidy(v, ctx);
        if (!Object.keys(t).length) return "";
        body = kvRows(t, 0);
      } else body = `<pre>${esc(String(v))}</pre>`;
      const raw = typeof value === "string" ? value.length : 0;
      const size = raw > 900 ? ` <span class="chars">${esc(t('graph.chars', { count: raw.toLocaleString() }))}</span>` : "";
      return `<div class="k">${title}${size}</div>${body}${truncationNote(value, repaired)}`;
    }
    // One line saying what a call was about, so the history scans unopened.
    function gistOf(value){
      const v = parseValue(value);
      if (v === null) return "";
      let text;
      if (Array.isArray(v)) text = t('graph.count.item', { count: v.length });
      else if (typeof v === "object")
        text = Object.entries(tidy(v)).map(([k, x]) => `${k}: `
          + (isScalar(x) ? String(x).replace(/\s+/g, " ").slice(0, 48)
                         : Array.isArray(x) ? t('graph.count.item', { count: x.length }) : "…")).join("  ·  ");
      else text = String(v).replace(/\s+/g, " ");
      return text.length > 140 ? text.slice(0, 140) + "…" : text;
    }

    // ── the execution panel ──────────────────────────────────────────────────
    const openCalls = new Set();      // calls the reader has unfolded
    let focusCallId = null, focusPending = false;   // a call reached from evidence
    let paintedId = null;
    // Live redraws of the node already on show keep the reader's place; a new
    // node opens at the top.
    function paint(n, html){
      const box = document.getElementById("detail");
      const top = paintedId === n.id ? box.scrollTop : 0;
      box.innerHTML = html; box.style.display = "block"; box.scrollTop = top;
      paintedId = n.id;
      if (focusCallId) {
        const el = box.querySelector(`.call[data-call="${CSS.escape(focusCallId)}"]`);
        if (el) { el.classList.add("focus");
                  if (focusPending) { el.scrollIntoView({ block: "center" }); focusPending = false; } }
      }
    }
    const KIND_WORD = { goal:"request", result:"answer", agent:"agent", agent_call:"agent",
                        tool_call:"tool call", system:"system" };
    const kindWord = n => {
      const key = "graph.kind." + n.kind;
      return t(key, KIND_WORD[n.kind] || n.kind || "");
    };
    function headOf(n, title){
      const c = statusColor(n), at = clockOf(n), dur = secsOf(n);
      const sub = [kindWord(n),
                   n.runs > 1 ? t('graph.detail.runOf', { run: n.run, runs: n.runs }) : "",
                   at ? t('graph.detail.started', { at }) : "", dur].filter(Boolean).join(" · ");
      return `<div class="dhead"><span class="close" onclick="closeDetail()">✕</span>`
        + `<h3>${esc(title)}</h3><div class="sub">${esc(sub)}</div>`
        + (n.status ? `<span class="badge" style="background:${rgba(c,.18)};color:${c};border:1px solid ${c}">${esc(n.status)}</span>` : "")
        + `</div>`;
    }
    function callRow(c){
      const when = [clockOf(c), secsOf(c)].filter(Boolean).join(" · ");
      const gist = gistOf(c.input);
      const files = [...(c.input_files || []), ...(c.output_files || [])];
      const body = (readable(t('graph.detail.arguments'), c.input)
          || `<div class="k">${t('graph.detail.arguments')}</div><div class="empty">${t('graph.detail.none')}</div>`)
        + readable(t('graph.detail.result'), c.output)
        + (files.length ? `<div class="k">${t('graph.detail.files')}</div><div class="kv">` + files.map(f =>
            `<div class="row"><span class="val mono">${esc(f)}</span></div>`).join("") + `</div>` : "");
      return `<div class="call${openCalls.has(c.id) ? " open" : ""}" data-call="${esc(c.id)}">`
        + `<div class="hd" onclick="toggleCall(this.parentNode)">`
        + `<i class="st" style="background:${STATUS_COLOR[c.status] || "#cbd5e1"}" title="${esc(c.status || "")}"></i>`
        + `<span class="tool">${esc(c.tool || t('graph.detail.call'))}</span><span class="when">${esc(when)}</span>`
        + `<span class="caret">▶</span></div>`
        + (gist ? `<div class="gist">${esc(gist)}</div>` : "")
        + `<div class="bd">${body}</div></div>`;
    }
    function toggleCall(el){
      const id = el.dataset.call;
      if (openCalls.has(id)) { openCalls.delete(id); el.classList.remove("open"); }
      else { openCalls.add(id); el.classList.add("open"); }
    }
    // An agent's final words, rendered as the document they are. Plain text
    // when the markdown libraries did not load.
    function reportBlock(title, text){
      if (!text) return "";
      const raw = String(text);
      let html;
      if (window.marked && window.DOMPurify) {
        try { html = DOMPurify.sanitize(marked.parse(raw), { ADD_ATTR: ["target"] })
